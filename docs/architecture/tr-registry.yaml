    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "27 **不写第二条 `ActorCellEntered`** —— 敌人的逻辑格是**纯派生态**,由三源逐位重建,**不进流**"
    domain: Core
    adr: ADR-016 + ADR-009
    status: covered
    revised: "2026-09-17"
    note: "**2026-09-17 用户裁定(PR-27-3)**。`ActorCellEntered` 的 `Actor` 命名只是留口(ADR-009 **Amendment G** 已注明);P0 只有玩家发。**AC-27-19 BLOCKING**(27 的世界流输出零 `ActorCellEntered`)。**显式记账的后果**:联机时客户端的敌人格**完全靠确定性重算** —— 这正是 ADR-016 §一「行为决策可重建」的**核心考验**;若重算会分叉,那是**决策器确定性有 bug**,不是「该给敌人加事件」。加事件会**掩盖** bug 而付出带宽 + 有界性代价。**登记义务 `O-27-6`**(ADR-009 §三 骨架补注此口径)"

