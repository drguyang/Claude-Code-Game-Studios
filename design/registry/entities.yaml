    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:F-6-1 + R-6-3 + AC-6-04/05 + Tuning Knobs 组 1
      - design/gdd/player-controller-and-movement.md   # 1:F-1-1a 的约束对象 + AC-1-06a/b/c(:430-436 所有权订正)
