    requirement: "敌人 id 经 `IIdAuthority` 发放,**与病人共用同一 id 空间与同一高水位**;高水位重构 `next = max(id)+1` 扫**三流并集**并排除 `PatientId.None`"
    domain: Core
    adr: ADR-006 + ADR-010 + ADR-016
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §二 **扩大 ADR-006 Amendment B 的 id 空间语义**(病人 → **受伤实体**);ADR-010 §七 定重构口径。**AC-27-17 BLOCKING**。**关键纪律**:敌人行住**世界流** ⇒ **不适用病史流折叠规则**(套用会错误折叠,Amendment B 注记);**折叠谓词不适用于敌人行**"

  - id: TR-enemy-017
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "敌人伤情事件**落世界流,不污染病史流**;逐 `Kind` 的**载荷形状归 25 的 GDD**(27 只定「住哪条流」)—— 27 需要的入向契约 = 「一条 `INJ_*` 状态变更事件,载荷含 `actor_id` + 伤情 id + 新状态」"
    domain: Core
    adr: ADR-016 + ADR-009
    status: covered
    revised: "2026-09-18"
    note: "**✅ 2026-09-17 转 covered —— `O-27-3` 的 25 侧兑现**:25 GDD 落盘 + 首轮评审修订,R2/R3 兑现 —— `Kind` 三元组已定名并登记(`EnemyInjuryOnset` = 敌人 onset 落世界流,写者 25;`InjuryStateChanged` = 状态变更落世界流,写者 9;`InjuryOnset` = 病人侧落病史流)。原 provisional 契约的字段假设已被真实载荷部分改写:**档位在 9 侧折叠**(`QueryHurtLevel`),25 载荷不携带严重度枚举 —— 27 的读法相应改为读 9 查询(`enemy-ai.md` §一① 已订正,非直读 25 事件)。路由断言(AC-27-16)不受影响:三 Kind 均按 `Kind` 纯函数路由,病史流零敌人行。**✅ 2026-09-18 独立确认**:25 二轮 `/design-review`(2026-09-18,新会话)二轮专项核对 `O-27-3` 口径通过 —— 置入方确认完成,⚠️ 移除"

  - id: TR-enemy-018
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "`ITameable` 接口 **P0 定型、P0 不实现** —— 形状 = 可驯化标记 + 归属 `OwnerId` + `TameState` 枚举;**命令通道复用行为程序**(`Follower` / `Guard` / `Stay` 作为行为程序可表达的目标态),**不新开第二条命令通道**"
