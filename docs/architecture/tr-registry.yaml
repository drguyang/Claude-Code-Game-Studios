  - id: TR-enemy-019
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "遭遇生命周期 = **两个世界流 Kind,写者故意拆开**:`EncounterStarted` 写者 = **52** · `EncounterEnded` 写者 = **27**"
    domain: Core
    adr: ADR-016 + ADR-021
    status: covered
    revised: "2026-09-17"
    note: "**2026-09-17 用户裁定(PR-27-4)**,判据 = **ADR-021 §① 的状态所有权**(所有权 = 写入权)。52 决定**来不来**(ADR-016 §八)⇒「开始」是 52 的裁定,与 `EventArrived` **同 tick 派生**(否则「事件已降临但敌人未出现」成为可观察的真空窗);「遭遇什么时候真的结束」(脱离成功 / 全员倒地 / 玩家走远)是 **27 的状态**,52 **不持有它、写不出它** ⇒ Ended 归 27。两 `Kind` 已入 `entities.yaml`(承 **`O-27-5`**,本 GDD 落盘时兑现)。**AC-27-18 BLOCKING**(27 的可写 `Kind` **恰** = {`EncounterEnded`} —— 正面白名单)。⚠️ `EncounterEnded` **≠ 实体消失**:「遭遇结束」是**战术关系**结束,倒地的敌人仍在世界里(`Down`,可被 10 救治 / 28 捕获);`reason` **必须是枚举不是布尔**(51 的回放分析须区分「玩家逃了」与「玩家打完了」,ADR-019 §一)"

