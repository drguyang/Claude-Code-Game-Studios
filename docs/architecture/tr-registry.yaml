  - id: TR-player-001
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "移动模型 = `CharacterController`(不参与 PhysX 求解;无 Rigidbody 驱动)"
    domain: Core
    adr: ADR-020
    status: covered
    revised: "2026-09-16"
    note: "ADR-020 §一。R-13 裁定;**理由**:本作 P0 玩家移动不与物理世界耦合(建造走整数格邻接,ADR-015 §五), kinematic Rigidbody 的物理交互价值用不上却换更难调的手感。**2026-09-16 GDD 落盘时细化**:判据扩为三条并列(`AC-1-01`)—— ① 无 `Rigidbody`/`AddForce`;② `CharacterController.Move` 是唯一位移写入点;③ `Physics.Raycast`/`CheckCapsule`/`Overlap*` 引用数为 0(可走性只由 collide-and-slide 给出,承 GDD R3)。断言面**含玩家预制体 / 场景资产的组件清单**,不止 `.cs` 引用集"

  - id: TR-player-002
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "玩家位移 = **纯表现态**;在 sim 中的唯一投影 = **跨格世界流事件**(连续位置 / 速度 / 朝向永不写流)"
    domain: Core
    adr: ADR-020
    status: covered
    revised: "2026-09-16"
    note: "ADR-020 §四 —— 是 ADR-016 §三(感知输入 = 粗粒度整数格)在**玩家侧(发出侧)**的对称落实。ADR-016 定义**读方**(13/27 读格),ADR-020 定义**写方**(玩家跨格发事件)。AC-20-03 BLOCKING。**2026-09-16 口径订正**:原写『频率 = 格穿越率』**不可证伪且与 F-1-1b 相抵** —— F-1-1b 只给**上界**(每 tick 至多一条,跨格检测每帧跑、tick 内后续跨格覆盖待发值);帧率 < tick 频率时同 tick 两次跨格被归并,等值不成立。**正确口径 = 事件率上界 = tick 频率**(与帧率无关、与位移距离无关)⇒ ADR-009 §六 有界性论证仍成立。判据改分两层(`AC-1-03`):①单元 —— 同 tick 喂 N ∈ {1,8,64} 样本断言 `Append == 1` 且载荷格 == 第 N 样本的格;②集成 —— `Append 总数 ≤ tick 数` ∧ **逐 tick** 核对「`Append` 的格 == 该 tick 边沿的 `pending_cell`」(**2026-09-16 二次订正**:原 ② 的 `≤ 相异格数` 合取项与 EC-3「回访再发」矛盾 ⇒ 已删,正确不变量是序列性质而非集合大小)。**载荷纯净判据亦订正**(`AC-1-02`):原『grep 无 `Vector3`→`Append` 路径』是**假阳性机器**(F-1-6 要求 `FloorToInt(p / LATTICE_SIZE)`,合法路径必然读 `Vector3`),改**反射断言** `ActorCellEntered` 字段类型集合 ⊆ {int32, int64, 整数枚举}"

  - id: TR-player-003
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "移动 / 旋转轴由 ADR-011 的动作映射供给(接口形状)"
    domain: Core
    adr: ADR-011 + ADR-020
    status: covered
    revised: "2026-09-16"
    note: "ADR-011 已定动作 → 意图的映射;ADR-020 §Architecture 固定系统 1 的输入面(`MoveInput`)。`<50 ms` 输入预算与移动手感同向(ADR-011 §二)。**2026-09-16 GDD 落盘时补**:① `Sprint`/`Jump` 两个动作**已补进 3 的 GDD**(`input-system.md` 规则二 + §Interactions)并同步 `systems-index.md:36`;② **1 不消费 `Look`**(用户裁定 2026-09-16)—— 朝向自动面向移动方向(F-1-4),`Look` 归 2 的相机;③ `‖MoveInput‖` 是**速度因子**不是开关(∈[0,1],进 F-1-2 的 `v_target`);1 **不裁剪**它,而是在 3→1 边界断言 `≤ 1`(`AC-1-09`)—— 坏值会**静默**破坏 F-1-1a"

  - id: TR-player-004
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "移动手感旋钮(移速 / 加速度 / 转向速率)的形状与归属"
    domain: Core
    adr: ADR-020
    status: covered
    revised: "2026-09-16"
    note: "ADR-020 §一 AC-20-11:**全部数值留白**(用户手调);ADR 只给形状。与 `feedback-user-owns-balance-values` 一致。**2026-09-16 GDD 落盘时定形**:Tuning Knobs 分六组 —— 组1 速度与手感 · 组2 跳跃 · 组3 转向 · 组4 地貌/情境乘数(**表内容归 6 / 24,不归 1**)· 组5 引擎/世界常量(**不归 1**,但 1 被锁住)· 组6 **明确不存在**的旋钮(防越界)。**新增跨系统调参纪律**:`K_TERRAIN_MAX`/`K_CONTEXT_MAX` 是 F-1-1a 速限的**派生**输入(各自表的上界),⇒ **6/24 调高一个乘数即可红掉 `AC-1-06`** —— 这是全系统唯一『动了它会红构建』的一组"

  - id: TR-player-005
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "二维 `MoveInput` → **世界方向**的基(相机相对;系统 1 读系统 2 的只读 yaw basis)"
    domain: Core
    adr: ADR-020
    status: covered
    revised: "2026-09-16"
    note: "**2026-09-16 系统 1 首轮 `/design-review` 第一根因**(三方独立命中 · 最高优先级)。初稿 F-1-2 写 `v_target` 却**从未定义 `MoveInput` 从哪组基投影到世界** —— GDD 全程可编译、单测可全绿,而**游戏不可玩**(移动方向无定义)。用户裁定 2026-09-16:**相机相对**(2 供 yaw basis)。ADR-020 §Key Interfaces 已就地补 `ICameraRig.YawBasis`(`(Vector3 fwd, Vector3 right)` 水平化正交基)+ **Amendment B**;系统 1 新立 **F-1-8**(`v̂_world := normalize(mx × f̂ + my × r̂)`,退化情形 → 世界 `+Z`)+ `AC-1-31`(单位性 + `y==0`)/ `AC-1-35`(单向无环 · 只读)。**方向单向**:1 读 2 的基(上游值),2 读 1 的 `Position`(下游值)—— 两条边方向相反,**不构成类型环**;1 **不读 `Look` 动作、不读相机变换矩阵**。判据 = AC-20-14。**2026-09-16 同日 GDD 落盘 ⇒ partial 的根因已消**,`status: partial → covered`:系统 2 GDD `design/gdd/camera-and-viewpoint.md` 落盘,上游交付面 = **F-2-2**(构造即正交归一)+ **`AC-2-07`…`AC-2-10`**;系统 1 侧 F-1-8 至此**有基可读**。⚠️ **残留未结的是 `O-11`**(`PITCH_MAX` 取值回填 `OQ-1-14`)与 **`O-14`**(帧内恒定对侧承诺)—— 二者**不阻塞本条的 covered**,但构成系统 1 的 `OQ-1-14` 结案路径"

  - id: TR-player-006
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "**跨格事件的 `Append` 权 = 主机唯一**(客户端经 ADR-001 第二 QoS 上行其格;不在可靠通道)"
    domain: Core
    adr: ADR-020
    status: covered
    revised: "2026-09-16"
    note: "**2026-09-16 系统 1 首轮 `/design-review` 第三根因**。ADR-020 §四 原文只说「玩家控制器负责跨格检测与事件发出」,却**从未指定联机时由哪台机器 `Append`** —— 与 ADR-005「**主机唯一执行 `Step` / `CatchUp`**」(⇒ 主机是唯一 Appender)冲突,且与该 ADR「跨格检测每台机器都在跑」不自洽。ADR-020 同日 **Amendment B** 四处裁决(用户照准):① **Append 权 = 主机唯一**(本机玩家在主机 ⇒ 直连;在客户端 ⇒ 客户端 **Append 调用点数为 0**,其格经 **ADR-001 第二 QoS** unreliable latest-value 上行,由主机权威控制器统一 Append);② **`ActorCellEntered` 移出可靠通道**(最新值语义 vs reliable-ordered;可靠通道被「急救 < 50 ms」`TR-concept-007` 占用);③ 远端队友同路径 ⇒ 主机 Append 后经世界流回播,**13 / 27 在所有机器读到同一条序列**(ADR-016 §一「第四来源」禁则不被破);④ 本地预测与主机权威的迟滞差 = 表现态正常代价,**不写流**。系统 1 落点 = **R5 / EC-16**(「谁 Append 什么」全表)/ `AC-1-30`(客户端 Append 调用点数为 0);判据 = AC-20-13。**`OQ-1-9` 就此结案**,实现落点在 45(登记义务 `O-4`)"

  - id: TR-player-007
    system: player-movement
    gdd: design/gdd/player-controller-and-movement.md
    requirement: "`CharacterController` 参数契约(`slopeLimit` / `stepOffset` / `minMoveDistance` / `skinWidth`)的命名与归属"
    domain: Core
