    note: "**✅ 2026-10-31 收口(机制补强);⚠️ `TD-s13-01` 状态维持 `partial`,不结案**。判据原本是一句散文——「`wc -l` > 0 且草稿内结论行数 ≥ 应核条数 / 2」——**「结论行」怎么数全凭编排方眼看**,与本项目反复抓到的「看起来可复算」同型。⇒ 新增执行体 `tools/review/draft_gate.py`,把那一句变成**退出码**(`0` 达标 · `1` 空/结论不足 · `2` 结构不符/文件不存在/参数非法);`code-review` SKILL 的 §Phase 7b ③ 与 §判据 **两处已接线**(收草稿时跑一次,不再眼看)。**刻意不做模糊启发式**:只认 Phase 7b ③ 规定的表格格式,不数 `✅` 出现次数(那会把「正文提到 FAIL 一次」也算一条结论)。**判别力 9 例逐例对表**(控制组 / 边界恰等 / 不足 / 只有表头 / 空文件 / 散文 / 数据行含 `valid`·`提供者` 防误判表头 / 文件不存在 / 负参数),9/9 实得与期望一致。🔍 **开发期抓到自己一个 bug 并修**:首版 `is_header` 用**子串**匹配 `id`,会把 `valid` / `provider` 这类数据行误判成表头 ⇒ **少算**结论行 ⇒ 把 PASS 判成 FAIL;改成**整格精确匹配**后第 7 例通过。**为什么状态仍 `partial`**(不借绿):本轮变的是**判据的可执行性**;本条剩余面是「这套机制能不能真的让 agent 不丢交付物」= **有效性**,只能由**下一次真实重评**实测。已有样本 **n=1**(2026-10-17 补记:A 草稿 11 行/3 项、B 草稿 45 行/4 项,撞轮零报告但草稿在盘),**不足以称有效**。结案条件已写入债册:下次真实重评产出 `draft_gate.py` 退出码 0 的草稿(≥ 两位专家各一份)后补记评估。回归三元组 `2026-10-31T09:16–09:18 CST` · S21-11 全量 · `21747919`+未提交:EditMode `6215/6178/0/0/37`(与 S21-8 同值,零回归)· PlayMode `238/234/0/2/2`(零回归)。本卡不触碰 `unity/`,无编译单元证伪轮(证据 = 脚本 9 例判别力)。"

