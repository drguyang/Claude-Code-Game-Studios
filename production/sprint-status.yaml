    ruling: "**裁定 A —— 收紧为「全部病种皆终态」**:条件 ① 由 ∃ 改为 ∀,`终态(p) = ∀ d ∈ D_p : ∃ PatientOutcomeChanged(p, d)`;`D_p` = 该病人的 `DiseaseOnset` 病种集合(ADR-030);**空集 `D_p = ∅` ⇒ false**(不取真空为真 —— 误折不可逆)。病人级布尔输出与折叠行逐病种产出**均不变**;仍是**逐病种存在性查询,不重放 F4**(ADR-032 ⑥ 的核心主张保留,收紧的是「查询几个病种」而非「查询还是重算」)"
    ruling_why: "**原注的前提被推翻** —— 它把多病种写成「若**将来**改为逐病种折叠」的假设,而多病种**当下可达**:`D-8-6` 共病合成已由用户提级 **P0 阻塞**,`AC-31` 原文即举「病人同时有 `position = 3/10` 与 `4/5` 两个病」。故「判成终态的病人不存在仍在演进的病程」这句**在 ∃ 口径下为假** ——「A 已终态、B 仍在演进」正是反例"
    ruling_fixes: "**修掉三个失效模式**:① B 的 `DiseaseOnset` 与全部病史行被静默抹除且不产 B 的折叠行(`BuildRows` 只遍历 `outcomes`);② B 日后终态时流里「有 outcome 无 onset」⇒ 再折必抛 `InvalidDataException`;③ 折叠把 A 的 outcome 一并抹掉而条件 ① 读的是**流** ⇒ 该病人此后再不可折、B 的新行**无界增长**"
    ruling_cost: "**代价**:一个长期病程会拖住整个病人不折 —— ADR-032 ⑤ 的上界 `Σ|D_p| ≤ PATIENT_APPEARANCE_CAP × |D_max|` 已覆盖,收紧后界**只会更小**"
