      - SPEED_MAX        # 水平净位移速度上界 —— *待定*,归 1(派生量;见 horizontal_antitunneling_invariant)
      - MAX_DT           # 单帧 dt 钳位上限 —— *待定*,归 1(见 constants.MAX_DT)
