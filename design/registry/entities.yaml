      ⇒ 6 的 §Dependencies 已写明该声明(系统 1 的 :1115-1127 明确要求 6 / 24 各写一遍)。
      **同源纪律**:`SAFETY_MARGIN` 须与 1 共同议定(6 的 `O-6-6`)—— 它受滑移与抬升影响,
      1 无法单方面保证。**载体未建**:CI 断言载体由 ADR-012 一并建。"
    added: 2026-09-16
    revised: ""

  # ── F-6-2: TERRAIN_TABLE → K_TERRAIN_MAX (world-and-ecozones.md §Formulas) ─
  # 6 的表 6 交付、1 派生。**与 24 的 `CONTEXT_TABLE` 同型**(后者归 24,撰写时须同法登记)。
  # ⚠️ 这条与 `horizontal_antitunneling_invariant` 是**跨系统调参纪律**的两端之一:
  # 那条是「唯一执行点」(CI 断言),本条是「被锁住的表的定义方」。
  # 值全待定:硬约束 —— 数值归用户,本表只登记形状与归属(行数 = 地貌材质种数,见 6 的 OQ-6-2)。
  - name: terrain_table
    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:R-6-11 + F-6-2 + AC-6-07/08 + Tuning Knobs 组 2
      - design/gdd/player-controller-and-movement.md   # 1:F-1-7 的 `K_TERRAIN_MAX` 来源 + AC-1-06c 的 AST 判据
      - design/registry/entities.yaml   # formulas.horizontal_antitunneling_invariant(消费本表的上界)
    variables:
      - terrain_id       # 地貌材质枚举(Gravel / Mud / Grass / Stone / Water / …)—— 内容侧稳定 id
      - K_speed          # 水平速度乘数 —— 硬约束 **> 0**
      - K_accel          # 加速乘数 —— 硬约束 **> 0**
      - K_decel          # 减速乘数 —— 硬约束 **> 0**
      - K_TERRAIN_MAX    # := max over terrain_id of TERRAIN_TABLE[terrain_id].K_speed —— **派生量,不是旋钮**
    output_range: ["(0, ∞)", "见 notes"]
    expression: "K_TERRAIN_MAX := max over terrain_id of TERRAIN_TABLE[terrain_id].K_speed"
    notes: "**粒度 = 地貌材质,不是生态区** —— 同一生态区内也有走感差异(6 的 R-6-11)。
      🔴 **`K_speed > 0` 是硬约束不是建议**:`K_speed ≤ 0` ⇒ 该地貌不可通行 ——
      **要做不可通行,用导航格的 `walkable = false`,不要用速度乘法**。
      把「不可走」表达为速度 0 会**静默**绕过 1 的隧穿检测(速度 0 ⇒ 永不跨格 ⇒ 断言恒绿)。
      🔴 **`K_TERRAIN_MAX` 禁手填**:须与 1 的 `SPEED_MAX` **同源派生**(同一份 `.cooked` 内算出),
      判据 = AC-1-06c / **AC-6-07** 的 AST 断言(禁数字字面量初始化)。
      手填则在 6 调表时**静默失效** —— 正是该式自称要防的失败。
      ⚠️ **`K_speed = 1` 的语义 = 「基准地貌」**,须存在且唯一(AC-6-08)。
      **配套**:脚步材质集须与本表的 `terrain_id` **同源**(6 的 A-6-1;音效资源归 44)。"
    added: 2026-09-16
    revised: ""

  # ── F-6-3: 生态区归属判定 (world-and-ecozones.md §Formulas) ───────────────
  # **本条是本表里唯一一条「算法」而非「不等式」的公式**,登记理由 = ADR-006 边界:
  # 射线法极易在某次重构中被写成浮点(除以斜率)⇒ 破坏「空间一律整数格」。
  # 值全待定:硬约束 —— 数值归用户,本表只登记形状与归属。
  - name: ecozone_of
    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:F-6-3 + R-6-4/5 + AC-6-19/20/21/22
      - design/gdd/random-events.md   # 52:spawn_anchor 的生态区归属解析(:429-451 / :693-702;NONE ⇒ 不入池)
      - design/gdd/systems-index.md   # §5 Core 依赖表 :300-306(6 的生态区边界是判定的输入)
      - docs/architecture/adr-015-world-geometry-fixed-world-lattice.md   # §一 生态区多边形 = 逻辑层整数数据
    variables:
      - p                # 待判定的格坐标(WorldPos;只用 x / z —— 生态区是平面划分,y 不参与)
      - ecozone_id       # 返回值:生态区枚举;**NONE = 合法结果**(区之间的真空带)
    output_range: ["ecozone_id", "NONE"]
    expression: "EcozoneOf(p: WorldPos) -> ecozone_id | NONE  # 标准射线法,全程整数运算"
    notes: "**边界行为全部显式,不留 hand-wave**:① 点在边上 = **内部**(闭集语义);
      ② 点在顶点上 = **内部**;③ **边界归属唯一** —— 同一格不得属于两个生态区
      ⇒ 「多边形共享边不重叠」是**烘焙期校验项**(EC-6-7 / AC-6-19);
      ④ 射线恰穿顶点 ⇒ 用**半开区间 `[y0, y1)`** 计数避免双重计数(射线法经典 bug,须专门夹具);
      ⑤ **`NONE` 是合法结果不是错误** —— 消费方(52 / 17 / 5)须**显式处理**,
      **不得默认为「最近的那个区」**(那是隐式插值,不可确定)。
      ⚠️ **全程整数**是硬约束(ADR-006 边界)⇒ **AC-6-22 单独成条**:该函数体内零浮点运算
      (连中间量也不得为 float / double)—— 该风险值得一条专属断言。"
    added: 2026-09-16
    revised: ""

  # ── F-6-4: POI 转移上界 (world-and-ecozones.md §Formulas) ─────────────────
  # **本式的价值 = 把 ADR-021 §④ 的 `|POI| × |STATE|` 收紧到 `2 × |POI|`** ——
  # 这是「6 定稿 PoiState 枚举」这一动作的**直接收益**,也是 ADR-021 刻意把枚举
  # 留给 6 的 GDD 的理由(TR-worldeco-009 由本条结清)。
  # 值全待定:硬约束 —— 数值归用户,本表只登记形状与归属。
  - name: poi_transition_bound
    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:F-6-4 + R-6-7 + AC-6-12/15 + States 的幂等条款
      - docs/architecture/adr-021-poi-state-ownership.md   # §决定④(原式 = |POI| × |STATE|;**本式收紧**)
      - docs/architecture/adr-009-world-state-event-boundary.md   # §六 世界流有界性(扩展而非重写)
      - docs/architecture/adr-010-persistence-save-format.md   # §三 义务 11(重建路径)
    variables:
      - Transitions(POI)  # 世界流中 PoiStateChanged 的总条数(会话内)
      - "|POI_DEF|"       # 烘焙逻辑层里的 POI 条数(**有限**,ADR-015 §一)
      - 系数 2            # 三态单调不可逆 ⇒ 每 POI 至多 2 次转移
    output_range: ["(0, 2 × |POI_DEF|]"]
    expression: "Transitions(POI) ≤ 2 × |POI_DEF|"
    notes: "**为什么是 2 而不是 3**:三态只有两条边(0→1、1→2);**跳级 0→2 只算 1 次**,
      是上界更松的情况,仍被 ≤ 2 覆盖。
      ⚠️ **本式成立当且仅当幂等丢弃生效**(同态重入不 Append)—— 若上游重投导致重复 Append,
      上界即被击穿(6 的 States「同态重入」条款 / AC-6-12)。
      ⚠️ **与 `SimEvent.Kind.PoiStateChanged` 的 `constraint` 字段协同**:该处原记
      `≤ |POI| × |STATE|`(ADR-021 §④ 口径),**2026-09-16 已同步收紧为 `2 × |POI_DEF|`**
      ——两处口径必须一致,否则世界流有界性论证出现两个版本。"
    added: 2026-09-16
    revised: ""

  # ── POI 定义表 (world-and-ecozones.md §Detailed Design R-6-6) ─────────────
  # **与 POI 状态严格二分**(ADR-021 §①):定义 = 派生态(烘焙逻辑层,**不进流**);
  # 状态 = 模拟态(进世界流)。本表登记**定义侧**的形状 —— 它是 52 的
  # `spawn_anchor` 解析输入,而该解析**永不读状态**(ADR-021 §⑤ / 6 的 R-6-10)。
  - name: POI_DEF
    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:R-6-6 + R-6-10 + F-6-4 + AC-6-18/23 + Tuning Knobs 组 5
      - design/gdd/random-events.md   # 52:spawn_anchor 解析的**唯一**输入(:143 / :429-451 / :693-702)
      - design/gdd/player-controller-and-movement.md   # 1:(间接,经生态区与格)
      - docs/architecture/adr-021-poi-state-ownership.md   # §① 定义 = 派生态 / §⑤ 解析只读定义
      - docs/registry/architecture.yaml   # states.poi_state(**状态侧**,与本条目成对)
    fields: ["poi_id(i32)", "cell(WorldPos)", "type(枚举)", "guard_config(整数枚举)", "ecozone_id"]
    expression: "POI_DEF : poi_id → { cell, type, guard_config, ecozone_id }  # 烘焙逻辑层,加载期重建,不进流"
    notes: "**发现它需要的信息都在这里,而这里没有玩家历史** —— 加载期重建即验(6 的 R-6-6)。
      🔴 **形态纪律**:`poi_id` 是**身份**,`cell` / `type` 是**属性** ⇒ 内容改版时
      **不得复用**已删除 POI 的 id(否则引用它的旧世界流触发 6 的 EC-6-4 硬失败);
      移动 `cell` **保留**状态,但任何以格坐标为键的外部引用随之失效(归迁移脚本,ADR-010 §七)。
      🔴 **发现门**(6 的 U-6-3 / AC-6-23):完整 `POI_DEF` **不得进呈现层** ——
