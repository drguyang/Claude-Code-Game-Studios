      - single_dose_max   # 单次最大剂量(病种/药侧登记);clamp 上界 = MAX_ACTIVE_DOSE × single_dose_max
    output_range: ["0", "对称界 ±(MAX_ACTIVE_DOSE × single_dose_max) 只罩 Σ(2026-09-16 四轮 K1 式体重写)"]
    expression: "Progress(t) = max( 0, (Base(τ) ⊔ Relapse(τ)) + Σ_{r∈compounds→d} Δ_progress_r(t) + clamp( Σᵢ drug_potencyᵢ×Decay(Δᵢ)·[polarityᵢ=causal]·[处置ᵢ∈treatable_by(d)], −(MAX_ACTIVE_DOSE×single_dose_max), +(MAX_ACTIVE_DOSE×single_dose_max) ) + Noise(seed,t) ), τ = t − onset_tick ; 潜伏期(τ<incubation)Progress≡0"
    notes: "两条不可动摇的约定,实现前必读:
      (1) 【时间原点】τ = t − onset_tick,τ_rel = relapse_interval × (复发次数+1) ——
          Base 与 Relapse 共用相对时基,全式只有 t 一个绝对量。
          早期草稿写作 t_rel = onset_tick + …(绝对量)与相对量的 τ 相减,会把首次复发推到负时刻。
      (2) 【括号】⊔(取大)只作用于 Base 与 Relapse 两条曲线,Σ drug_potency×Decay 与 Noise 在括号外相加。
          复发与处置偏移重叠时取大不取和 —— 相加会让病情假性叠加。
      (3) half_life 衰减的是【处置偏移】不是【病情】,故归 11 处方 / 21a 的 drug_profile(D-21-6),
          不登记在病种注册表:病种定义「病怎么走」,药定义「药怎么退」。
      (4) 【polarity 门】(2026-09-15 B5,与 GDD 同轮):Σ 和式内显式限定 polarityᵢ=causal ——
          对症处置(柳树皮)只改 F2 的 Sign 层,不改 Progress(两层和式显式分区,规则三)。
      (5) 【潜伏期抑制】(2026-09-15 同步 GDD blk #9):τ<incubation ⇒ Progress≡0,
          噪声不得使潜伏病人「有读数」(破 AC-22)。
      (6) 【剂量饱和截断】(2026-09-16 三轮 · 二轮 C2 + 四轮 K1 改对称):Σ drug_potencyᵢ×Decay(Δᵢ)
          的绝对值爬上 MAX_ACTIVE_DOSE × single_dose_max 时【clamp 对称截断到 ±界】,后续 Decay 继续走
          —— 不拒绝、不弹 UI(无「剂量超限」分支)。**界只罩 Σ,不罩整式**(Base/Relapse/Noise 不参与
          clamp —— 否则 plateau∧lethal 型自然曲线被截断,永不死亡/永不痊愈);**对称下界防死旋钮**
          (对因与 Base 异号时 Σ<0,单向「Σ≤正上界」恒真 ⇒ 截断永不触发,MAX_ACTIVE_DOSE 成死旋钮)。
          运行期记账:活动剂量 = Σ 未衰减尽的 drug_potencyᵢ×Decay。
      (7) 【对症层另式】(2026-09-16 三轮 · 二轮 F):对症层用 symptomatic_potencyᵢ,ⱼ×Decay(Δᵢ)·[polarityᵢ=symptomatic]
          分病种投影到 F2 Sign 层,不进本式的 Progress(两层显式分区,规则三)。
      (8) 【compounds 显式加成】(2026-09-16 四轮 K1/K4):Σ_{r∈compounds→d} Δ_progress_r(t) 为加性阶跃项,
          在 clamp 外、与处置 Σ 分离 —— Δ_progress 是病种数据声明的病程变化,不是玩家处置,不受剂量界;
          乘性 Δ_rate = τ_rise 缩放(仅 τ<τ_peak),**同 target 与 Δ_progress 不可混用**(构建期拒绝,
          四轮 K4:乱序不变只对加性项承诺)。
      (9) 【离牌门】(2026-09-16 四轮 K1 补入式体):Σ 内显式限定 [处置ᵢ∈treatable_by(d)] ——
          不在病种×处置门内的处置贡献 = 0(规则三注;取舍 4 此前只在散文,式体缺失)。
      曲线参数 schema(含禁止写 AnimationCurve 的理由)见 disease-simulation.md R1.3。
      其余同 GDD §Formulas F1。"
    added: 2026-09-13
    revised: 2026-09-16

  # ── F2: 体征投影 (disease-simulation.md §Formulas) ─────────────────────
  - name: sign_projection
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      - design/gdd/case-system.md   # 37 包装的读数记录消费其投影(2026-09-15 回填)
      # ✅ 2026-09-19:8 诊断已成稿(diagnosis-system.md:84 显名引用 sign_projection + SKILL_CAP);通道集合归 8(R-8.1)
    variables:
      - Progress
      - SCALE_病种
      - W                 # trend 中心差分窗口
      - TREND_EPS         # 趋势死区(2026-09-15 同步 GDD blk #5)—— |trend|<TREND_EPS ⇒ 判「持平」
      - 对症处置偏移
      - symptomatic_potency  # 对症层系数,由 11 处方产出(2026-09-16 三轮 · 二轮 F);原「对症处置偏移」只留符号
    output_range: ["position: 0", "position: 1"]
    expression: "position = clamp(Progress(t)/SCALE_病种, 0, 1) ; trend = (Progress(t+W/2) − Progress(t−W/2))/W ; trend_backward(t) = (Progress(t) − Progress(t−W))/W ; (对症处置偏移)ⱼ = symptomatic_potencyᵢ,ⱼ × Decay(Δᵢ)·[polarityᵢ=symptomatic] ; 状态转移用 trend_backward,展示用 trend"
    notes: "规则三「病情/体征两层」的机制实现:Progress 只被【对因】处置改,Signⱼ 被【对症】处置改 ——
      柳树皮降热但不改病情,金鸡纳皮改病情。
      trend 用【中心差分】而非一阶差分:处置发生在窗口内时一阶差分跳变,玩家会看到「突然变坏」的假信号;
      中心差分天然抵消对称跳变,且解析式求值免费。
      trend 不在 output_range 内 —— 它未归一(单位是「每 tick 的进度变化」),符号是唯一有意义的读数。
      ⚠️【因果拆分】(2026-09-15 同步 GDD B5):中心差分读 t+W/2(未来),展示层无害(纯函数),
      但 F4 状态转移用未来时刻决定状态 = 非因果 —— 转移改用 trend_backward(只读过去);trend 仅用于 8 的展示。
      ⚠️【死区 TREND_EPS】(同步 blk #5):Q16.16 下两 Progress 近乎相等时直接相减 = 0 或 ±1 LSB
      纯量化噪声,恰在最需要趋势的心衰类失真 —— 差分在 Q32.32 求 + TREND_EPS 死区,「持平」是确定判定。
      ⚠️【对症层另式】(2026-09-16 三轮 · 二轮 F):对症处置偏移用 symptomatic_potencyᵢ,ⱼ×Decay(Δᵢ)·[polarityᵢ=symptomatic]
      **分病种投影到 Sign 层**,不进 Progress(两层显式分区 —— 与 disease_progression notes (7) 对称)。
      ⚠️ 本公式【不含可读性判定】—— READ_FLOOR / BASE_READ / 技能→精度映射曲线于 2026-09-14
      迁至 8 诊断(门槛是玩法决策,不是模拟决策;且 9 若按技能过滤会破坏 ADR-005 逐位一致)。
      9 无条件出 position/trend 真值,BASE_READ 不再是本公式的变量。"
    added: 2026-09-13
    revised: 2026-09-16

  # ── F3: 定 tick 与离线补算 (disease-simulation.md §Formulas) ───────────
  - name: catchup
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      # ✅ 2026-09-16 7a 持久化 GDD 落盘:catchup 的 authority-agnostic 正交性由
      #   7a 守(规则十二 C6 · AC-7a-16 —— 见 persistence-service.md)
    variables:
      - TICK_SECONDS
      - sigma
      - boundary_mode
      - FIXED_ITER
    output_range: ["0", "类A边界数 + 每子区间 log(区间/步长)"]
    expression: "t = ⌊GameClock / TICK_SECONDS⌋ ; CatchUp 枚举类A闭式边界 → 切子区间 → 保守带|Noise|≤σ 外跳过/内二分 → 写回缺失病史事件"
    notes: "复杂度不随离线时长线性增长 —— 这是规则二「O(处置次数)」的落地。
      ⚠️ 该复杂度【不是自动成立】的,由三条共同保证:① 类A边界有具名闭式
      ② 类B用保守带 ③ 每个病种登记 boundary_mode。缺任一条,F3 会悄悄退化成扫描。
      boundary_mode 必须【登记为数据】(规则九),否则会在第 4 个月做存档时才发现某病种不可闭式求解
      —— systems-index.md §8 标的正是这个爆点。
      FIXED_ITER 保证「确定终止」,不保证「收敛到正确根」:固定迭代只解决确定性,不解决正确性。"
    added: 2026-09-13
    revised: ""

  # ── F4: 阈值与转移判定 (disease-simulation.md §Formulas) ───────────────
  # 2026-09-15 二轮复核同步:① 判定顺序严重度降序(死亡→昏迷→危殆→潜伏→其余);② B′ 死亡谓词
  # last_effective_treatment → last_intervention;③ 九态闭合
  # (痊愈由 RECOVER_THRESHOLD 判定 + 迁延由 trend_backward_agg 分段);④ 字段名 drug_potency/half_life。
  # 2026-09-16 三轮修订(二轮 A/E):B′ 照护语义改为「玩家主动护理动作」事件(非 EnvMod、非「在医馆」);
  # 痊愈谓词加 ¬(豁免类);notes 补按型下界(R1.3 校验 14)。
  - name: threshold_transition
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      - design/gdd/case-system.md   # 37 包装的病史事件流订阅其触发(2026-09-15 回填)
      # 34 公卫与疫情 GDD 尚未撰写 —— 撰写时须回溯追加(13 已结清,见下)
      # ✅ 2026-09-15 ADR-016 §六:13 只读本组阈值对应的**状态量**,不读阈值本身;13 不写三流(表现映射归 13,不经 sim)
      # ✅ 2026-09-15 13 GDD 落盘:13 用自有 BEHAVIOR_BAND_* 分档,**不重建 9 的九态**(TR-patient-004 · AC-13-A3 BLOCKING)
    variables:
      - CRITICAL_THRESHOLD
      - COMA_THRESHOLD
      - DEATH_THRESHOLD
      - RECOVER_THRESHOLD     # 痊愈判定(2026-09-15 B5,九态闭合)
      - TREATMENT_WINDOW
      - self_limit
      - lethal
      - position_agg
      - trend_backward_agg    # = max over d∈D of trend_backward_d(2026-09-15 B5)
      - last_intervention     # 原 last_effective_treatment;B′ 定义见 notes
      - 豁免类                 # 2026-09-16 三轮 · 二轮 A;豁免类永不入痊愈(见 notes (5))
      - 可愈性谓词            # 2026-09-16 三轮 · 集群 4;痊愈支结构门(self_limit 型 ∨ 豁免类下界)
      - 非上升期门            # 2026-09-16 四轮 K5;痊愈支 trend_backward_agg ≤ 0 或 τ > τ_peak
      - CARE_GAP              # 2026-09-16 三轮 · 集群 2;last_intervention(照护) 派生式的时基
    output_range: ["潜伏|发病|进展|好转|迁延|危殆|昏迷|痊愈|死亡"]
    expression: "在 tick 采样点上判定,不求根 ; 判定顺序(严重度降序):死亡 ← lethal ∧ self_limit=false ∧ position_agg≥DEATH_THRESHOLD ∧ (t−last_intervention)>TREATMENT_WINDOW ; 昏迷 ← lethal ∧ position_agg≥COMA_THRESHOLD ; 危殆 ← position_agg≥CRITICAL_THRESHOLD ; 潜伏 ← τ<incubation ; 痊愈 ← position_agg<RECOVER_THRESHOLD ∧ 无 relapse.* 块 ∧ ¬豁免类 ∧ 可愈性谓词(self_limit 型 ∨ 豁免类下界) ∧ 非上升期门(trend_backward_agg≤0 或 τ>τ_peak) ; 其余 ← 迁延,由 sign(trend_backward_agg) 分段"
    notes: "【铁律一:死亡必须被挣得】在公式层的实现 —— 三个条件缺一不可:
      (1) self_limit = false —— 否则自限性病也「时间到就死」,那是伪装违反;
      (2) 【B′ 定义,2026-09-15 用户裁定;2026-09-16 三轮改语义】last_intervention = last of:
          · 有效对因处置(polarity=causal ∧ drug_potency 与 Base 异号)
          · 【照护 = 玩家的主动护理动作】24 的护理动作事件的起/止(成本 = 时间/资源,
            仅在动作持续期内计数);相邻护理动作 gap > CARE_GAP ⇒ 视为中止。
        **「放医馆」本身不自动计数;EnvMod 不得被读取、不得用于照护判定**(2026-09-16 三轮 · 二轮 B2/B3)。
        ,若两者均不存在 = onset_tick 哨兵(缺哨兵则「从未被治过」的病人该项无定义,死亡判定整条短路,
          而「见死不救」正是它要覆盖的情形)。
          对无对因手柄的病种(照护杠杆适用 = {伤寒 / 痢疾 / 心衰} 3 种,2026-09-16 四轮 K8 收窄):
          照护杠杆仍生效 —— 主动护理动作刷新 last_intervention,照护停止后才开始倒计时 ⇒
          死亡 = 越阈 + 弃护后过窗口,不是纯计时器(B′)。**破伤风剔除(K8)**:护理【不刷新窗口】,
          与对症药同级;其手柄 = 发病前清创预防(R3.3),发病后越阈 + 过窗口即死。
          对症药(polarity=symptomatic)【不得刷新窗口】—— 否则柳树皮「续命」,伪治疗(旧谓词
          last_effective_treatment 只认对因是它的前身;B′ 把照护通道并入,药仍只认对因)。
      (3) 判定顺序【严重度降序】是规格的一部分 —— 原稿按潜伏→危殆→昏迷→死亡列出,实现为
          if/else 时危殆先命中,昏迷/死亡成死代码(2026-09-14 blk #2)。
      (4) 【痊愈 / 迁延闭合】(2026-09-15 B5):转移表不得混入非状态名(自愈/复发是路径不是状态);
          痊愈 ← position_agg<RECOVER_THRESHOLD ∧ 无 relapse.* 块 ∧ ¬豁免类(终态;带 relapse 的病种
          与豁免类病种均不入痊愈);迁延 = 未达任何阈值 ∧ 未达痊愈,由 sign(trend_backward_agg) 分段
          (只读过去,非因果修正)。
      (5) 【痊愈门按型下界】(2026-09-16 三轮 · 二轮 A,R1.3 校验 14):痊愈门不是全局单一值 ——
          ① plateau ∧ lethal ⇒ A_peak/SCALE ≥ DEATH_THRESHOLD(否则 plateau 把死亡压成痊愈);
          ② 豁免类 ⇒ RECOVER < A_peak/SCALE < CRITICAL(豁免类【永不入痊愈】是 feature 不是缺陷,
             第二幕出场由铁律三 new-onset 另行提供);③ 急性保持型 ⇒ A_peak/SCALE ≥ DEATH_THRESHOLD。
          豁免类终态之外的出口 = 铁律三「新发病种」(不是被治好的)。
      放弃求根的理由:Noise 破坏单调性、处置在 t=tickᵢ 处引入导数跳变,二分可能失效或收敛到错误的根。
      9 的状态转移本就是 tick 离散的,采样点判阈值足够。"
    added: 2026-09-13
    revised: 2026-09-16

  # ── F5: 难度曲线滑窗密度 (telemetry-analytics.md §Formulas) ────────────
  # 首次登记 2026-09-16(#51 GDD 落盘)。**登记理由**:51 使 5 时间天气 / 17 采集
  # 的「看得见的难度曲线」门控【可测】(ADR-019 §一 表末行,GDD §Dependencies 下游列)。
  # 若 5 / 17 复用同一形状,窗口口径必须**同源** —— 否则两处各自定义窗口 ⇒ 密度曲线不可比。
  # 值全待定:数值归用户(51 GDD §Tuning Knobs `W` / `S` / `t_0` 均 `*待定*`)。
  - name: difficulty_curve_window_density
    status: active
    source: design/gdd/telemetry-analytics.md
    referenced_by:
      - design/gdd/telemetry-analytics.md   # 51:F5 难度曲线(三流各一条序列)
      # ✅ 2026-09-19:5 时间与天气 / 17 采集 皆已成稿(time-and-weather.md 季节修正归 17 · foraging.md:39 难度曲线,正文均已引用)
    variables:
      - W        # 窗宽(Tick)—— *待定*
      - S        # 步长(Tick)—— *待定*,可 > W(窗间留空须由 WindowCoverage 记账)
      - t_0      # 首窗起点(Tick)—— *待定*
    output_range: ["0", "PATIENT_APPEARANCE_CAP"]
    expression: "Dens_s(t_k) = |{ e ∈ E : Kind(e) ∈ s ∧ t_k ≤ Tick(e) < t_k + W }| ,  t_k = t_0 + k·S ;  s ∈ {病史, 病例, 世界}(三流各一条序列,不合并)"
    notes: "**三流语义不同**(病例 = 判断负载 / 病史 = 病人处置负载 / 世界 = 建造掉落活动)⇒ 输出三条独立序列,禁合并为单一标量。
      窗口**半开** [t_k, t_k+W) —— 边界只取一次,防同 Tick 事件双计。
      W < 1 ⇒ 构建期 / 加载期**硬失败**(非运行期退化、非静默取默认值)。
      S > W ⇒ 合法,但须由 WindowCoverage = (CoveredTicks, SpanTicks) 记账;
      **不记账而只报密度 = 把「没测」伪装成「测得 0」**。
      输出域上界由 `PATIENT_APPEARANCE_CAP`(**9 的配置项,✅ 2026-09-20 已标定 = 24,模拟范围 = 在场才模拟**)
      与三流有界性(ADR-008 §六 / ADR-009 §六)封顶。
      ⚠️ 51 只**报形状**,**不报因果**(R10);本式**不得**被用于门控别人 —— 51 是仪器,不是裁判。"
    added: 2026-09-16
    revised: ""

