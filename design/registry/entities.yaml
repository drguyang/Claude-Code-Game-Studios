      `λ = 1 − ω·dt` 才会发散，而 F-2-1 已改为**半隐式 + 子步**（线性阻尼下**无条件稳定**）；
      ② 钳位**只掩蔽单帧尖峰**，救不了「`ω` 过大 / 积分器选错」。
      ⇒ **同源的真正理由**是**两条链面对同一次掉帧必须承认同一个「最大单帧位移」**：
