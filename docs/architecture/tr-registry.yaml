    status: partial
    revised: "2026-09-17"
    note: "**2026-09-17 用户裁定(PR-27-1)**。partial 的根因 = ADR-016 §九 的「P0 只留**一个**原型」**字面**与 P0 池含野兽(`random-events.md:394` / `game-concept.md:791`)**张力未解** —— 本裁定把「一个」读作**行为程序的表达能力上限**(一套数据集 / 一个决策器),**不是实体种类数**。**须回填 ADR-016 §九 口径澄清(登记义务 `O-27-4`)**;回填后本项转 covered。**AC-27-24 BLOCKING**(存在恰好一套行为程序 `ai_enemy`,兵痞 / 野兽共用它)"

  - id: TR-enemy-006
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "行为载体 = **编辑器期作者态 → 构建期烘为整数数据**(`assets/data/ai_enemy.json` → `ai_enemy.cooked`);**运行期零第三方行为树 / 寻路库**;源改了没重烘 ⇒ **构建失败**(陈旧门,非运行期幻觉)"
    domain: Core
    adr: ADR-016 + ADR-014
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §四 + ADR-014 两阶段烘焙。**AC-27-22 / AC-27-23 双 BLOCKING**:**零**第三方行为树 / 寻路库程序集(正面白名单:程序集引用集)+ 陈旧门 `throw`。**残留实现债**:编辑器期行为树工具的**导出 / 烘焙链路可行性未实测**(ADR-016 §四 Verification ③);若不可用 ⇒ 退回**自研数据表载体**,**不改变本项的确定性形态**"

  - id: TR-enemy-007
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "行为程序里**禁 `float`** —— 空间量 = `WorldPos` 整数格 / 朝向枚举;非空间量(仇恨值 / 威胁权重 / 士气)= `Fix`(Q16.16)或 `int`"
    domain: Core
    adr: ADR-016 + ADR-006
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §四 + ADR-006 定点域边界。**AC-27-03 BLOCKING**(门 B 扩展:扫描 sim 侧程序集公开类型签名与字段类型,**正面白名单 = 允许类型集**)+ **AC-27-09 BLOCKING**(烘焙数据行**无 `float` 字段**,否则 `throw`)"

  - id: TR-enemy-008
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "**决策 = 派生态,不进流** —— 效果(受伤 / 昏迷 / 遭遇开始结束)进流;「它决定包抄左边」不进流,加载 / 重放期由三源重建"
    domain: Core
    adr: ADR-016 + ADR-009
    status: covered
    revised: "2026-09-17"
    note: "ADR-009 §一 Q1 判据 + ADR-016 §一「**效果进流,决策不进流**」。这是与 13 同源的纪律(13 的决策住边界层;27 的决策**住 sim** —— 两者差别在**是否读 float**,不在是否进流)"

  - id: TR-enemy-009
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "决策频率按 **LOD 节流**(近 / 远 / 冻结),但**节流不改变判定结果** —— 解冻后从三源重建,同 tick 状态**逐位一致**,且解冻耗时**与冻结时长无关**(不补算)"
    domain: Core
    adr: ADR-016
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §九(「批处理友好形状」纪律的兑现)。**AC-27-04 / AC-27-05 双 BLOCKING**(开 / 关 LOD 的 sim 真值相同;解冻后逐位等于「从头到尾不冻结」)。F-27-3。**这是 ADR-016 §九「不为多原型预置复杂度」的承重前提** —— 若节流会改变判定,砍原型就变成砍正确性"

  - id: TR-enemy-010
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "**「可脱离」是状态机的对等态,不是特例** —— 进入 `Disengage` 的条件**必须**包含「玩家离开了接触范围」与「我方战败」**并列**;**禁**「不可脱战」的硬锁定仇恨"
    domain: Core
    adr: ADR-016
    status: covered
    revised: "2026-09-17"
    note: "**AC-52-16**(「遭遇体不锁定玩家」)的 27 侧机械落点;ADR-016 §八 定 52 ↔ 27 的分工(52 定「要不要来」,27 定「来了怎么动」)⇒ 可脱离是 27 的行为约束。**AC-27-06 BLOCKING = 图可达性断言**(存在从任一非终结态到 `Disengage` 的路径),**不是**「逐态检查」;**AC-27-07 BLOCKING** = 玩家全程不接战时,`DISENGAGE_DELAY` 后确实写出 `EncounterEnded{reason = 脱离}`。F-27-5。**承重约束,不是平衡旋钮**(§反幻想第一条)"

  - id: TR-enemy-011
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "27 的寻路输入 = 23 合成的 **`EffectiveWalkable(cell) := Nav[cell].walkable ∧ ¬Overlay.blocked(cell)`**;**不读**静态烘焙 `Nav` 原件"
    domain: Core
    adr: ADR-016 + ADR-015
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §五 补注 + ADR-015 §五;**23 是唯一合成点**(`modular-building.md` F-23-1,结清 6 的 `O-6-10`)。**AC-27-12 BLOCKING**(静态检查 27 的读取路径,唯一来源 = `EffectiveWalkable`)。玩家放置的墙 / 家具**当场改变敌人的可走空间** —— 这是 §Player Fantasy 基础设施层的机制落点。**残留实现债**:27 每 tick 轮询的成本**未实测**(敌人数量 × 路径长度上升时)"

  - id: TR-enemy-012
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "路径重规划由 27 侧**轮询**触发(当前路径格集 ∩ 新 blocked 格 ≠ ∅ ⇒ 下 tick 重规划);**23 无 push 义务**,27 **不自建** blocked 格集副本、**不监听** `Structure*` 维护副本"
    domain: Core
    adr: ADR-016
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §五。「不自建副本」是同 13 的规则三纪律(**第二真源风险**)。**AC-27-13 BLOCKING**(玩家在路径中段放置模块 ⇒ 敌人**下 tick** 重规划,新路径不含该 blocked 格)。EC-27-06"

  - id: TR-enemy-013
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "sim 走**整数导航格 A***,表现层 `NavMeshAgent` + 动态 `NavMeshObstacle`(carving)只负责把逻辑路径变成连续位移;**漂移的处置方向单向** —— 表现层 snap / 修正,**禁** sim 跟随表现层"
    domain: Core
    adr: ADR-016 + ADR-015
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §五 + ADR-015 §五(NavMesh 仅表现态)。「sim 跟随表现层」= **float 入 sim**,破 ADR-006 边界。**AC-27-14 BLOCKING** 的伴随项:被完全围死 ⇒ `PATH_FAIL_GRACE` 后进 `Disengage`,**且期间未发生瞬移**(逻辑格连续)。EC-27-07 / 08。**残留实现债**:NavMesh tile 动态重烘成本须实测(ADR-016 §五 Verification ②)"

  - id: TR-enemy-014
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "逻辑位姿 `LogiPose = (WorldPos Cell, byte Facing)` 在 sim 逐 tick 整数推进;**禁**从 `Transform.position` 反推逻辑格"
    domain: Core
    adr: ADR-016 + ADR-015
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §一 + `adr-015:157` 同条纪律。**AC-27-15 BLOCKING = 性质测试**(对任意 `ENEMY_SPEED < FIX_ONE` 成立:`LogiPose.Cell` 永远整数且每 tick 位移 ≤ 1 格)。F-27-4 的定点累加器解决**跳格**(tunneling);`ENEMY_SPEED ≥ FIX_ONE` ⇒ 穿墙的构建期断言见 AC-27-08"

  - id: TR-enemy-015
    system: enemy-ai
    gdd: design/gdd/enemy-ai.md
    requirement: "敌人 = **可受伤实体,复用 9 的伤情模型** —— 生命 / 伤情 / 昏迷状态住 9 的注册表,**不新开第二套生命模型**(归零 = `INJ_COMA`,非致命)"
    domain: Core
    adr: ADR-016
    status: covered
    revised: "2026-09-17"
    note: "ADR-016 §二。25 已把「生命归零」登记为 `INJ_COMA`(`disease-simulation.md:366`)⇒ **非致命模型自动适用于敌人**;`skill-system.md` 的「**人形敌人被误杀不可能发生**」由此获得**实现侧**保证(不再只是设计承诺)。⚠️ **野兽语义分叉**:真值注册仍走 9 同一张表(不新开模型),但**语义标签不同**(人形 = 可救治的昏迷;野兽 = 不再构成威胁的倒地),**P0 不交付对野兽的救治动词**(归 28 / 10)"

