# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: world_state_total_order
    status: active
    pattern: shared_resource  # 三流共享排序契约(ADR-009 §三 / Amendment E)
    producer: "主机"
    consumers:
      - "6 世界与生态区"
      - "17 采集"
      - "20 库存与物品"
      - "23 模块化建造"
      - "24 医馆即机器"
      - "45 网络层"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    signal_signature: "sort(a, b) = (Tick asc) → (StreamPriority: 病史<病例<世界) → (Patient asc) → (Seq asc)。Seq 发放域唯一 (Tick, Patient),三流共享;世界事件 Patient = PatientId.None"
    referenced_by:
      - docs/architecture/adr-009-world-state-event-boundary.md
      - docs/architecture/adr-006-fixed-point-boundary-contract.md   # Amendment E
    added: 2026-09-15
    revised: ""

  - contract: event_stream_routing
    status: active
    pattern: event_bus        # IEventSink 按 Kind 纯函数路由到两流
    producer: "主机(唯一 Append)"
    consumers:
      - "37 病例系统"          # 读病例流:case_id / fires-once / 结案
      - "53 医疗后果与责任"      # 订阅 CaseClosed / PatternRecognized(结算)
      - "45 网络层"            # 传输两条逻辑流
    adr: docs/architecture/adr-008-case-event-stream.md
    signal_signature: "IEventSink.Append(in SimEvent e) — Kind ∈ {病史类} → 病史流;Kind ∈ {CaseOpened/CaseClosed/PatternRecognized/JudgmentRecorded/JudgmentRevised} → 病例流;Kind ∈ {Structure*/Drop*/Craft/ResourceHarvested} → 世界流(ADR-009 §三)"
    referenced_by:
      - docs/architecture/adr-008-case-event-stream.md
      - design/gdd/case-system.md
    added: 2026-09-15
    revised: ""

  - contract: cross_stream_total_order
    status: active
    pattern: shared_resource  # 全序键是跨流共享的排序契约
    producer: "主机"
    consumers:
      - "37 病例系统"
      - "45 网络层"
      - "53 医疗后果与责任"
    adr: docs/architecture/adr-008-case-event-stream.md
    signal_signature: "sort(a, b) = (Tick asc) → (病史流 < 病例流) → (Patient asc) → (Seq asc)。零新全局计数器。2026-09-15 ADR-009:StreamPriority 升三值(病史<病例<世界),见 world_state_total_order"
    referenced_by:
      - docs/architecture/adr-008-case-event-stream.md
      - design/gdd/case-system.md
    added: 2026-09-15
    revised: ""

  - contract: replay_pipe
    status: active
    pattern: event_bus        # 主机 Publish / 客户端 Subscribe;纯管道,零语义判断
    producer: "主机(唯一 Append)"
    consumers:
      - "45 网络层"            # pipe 抽象承载三流传输 + 表现态位置
      - "客户端(流副本 + 快照,ADR-005)"
    adr: docs/architecture/adr-001-networking-pipe-abstraction.md
    signal_signature: "IReplayPipe{Publish(in SimEvent) · Subscribe(Action<SimEvent>) → IDisposable} + ReorderBuffer(有界,全序键吸收重排)。可靠即可、保序非必需;表现态位置走第二 QoS 通道(PublishPositional,unreliable latest-value)。库选型 P1b 前 swap 评审(ADR-001 §四)"
    referenced_by:
      - docs/architecture/adr-001-networking-pipe-abstraction.md
      - docs/architecture/adr-005-deterministic-sim.md   # 客户端流副本
      - docs/architecture/adr-009-world-state-event-boundary.md   # 表现态位置走 45
    added: 2026-09-15
    revised: ""

