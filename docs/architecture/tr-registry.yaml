    note: "**2026-09-16 ADR-020 Amendment B 新立**(由系统 1 首轮 `/design-review` 的第一根因驱动)。`(Vector3 fwd, Vector3 right)` —— `f̂` = 相机前向的**水平投影归一化**,`r̂ := normalize(cross(worldUp, f̂))`;**只读**(系统 1 零写入相机状态 / 变换)· **水平化且正交归一**(`y == 0` ∧ `f̂ ⟂ r̂`)。**单向** —— 1 读 2 的基(上游值),2 读 1 的 `Position`(下游值),两条边方向相反 ⇒ **不构成类型环**;1 **不读 `Look` 动作、不读相机变换矩阵**。判据 = AC-20-14 / 系统 1 的 `AC-1-31` / `AC-1-35` ③④。**2026-09-16 GDD 落盘 ⇒ partial 的根因已消**,`status: partial → covered`:系统 2 GDD `design/gdd/camera-and-viewpoint.md` 落盘,**F-2-2**(`f̂ := (sin yaw, 0, cos yaw)` / `r̂ := (cos yaw, 0, −sin yaw)` —— **构造成立,不靠事后归一**)+ **§B 组四条判据** = **`AC-2-07`**(水平化:遍历 `pitch` 采样点,`y ≡ 0`)· **`AC-2-08`**(正交归一:遍历 `yaw` 全周,含回绕点)· **`AC-2-09`**① **装载期断言 `PITCH_MIN < PITCH_MAX < 90°`** ⇒ 系统 1 的 F-1-8 退化分支**正常操作下不可达** · **`AC-2-10`**(一帧内 yaw 更新点 ≤ 1 + 系统 1 写入数 = 0)。⚠️ **`AC-2-09` 同时是 `O-11` 的载体** —— `PITCH_MAX` 的实际取值须回填系统 1 的 `OQ-1-14` 并结案(该义务**未结**)。⚠️ **交付义务 `O-8` 由 2 侧兑现;`O-11` / `O-14` 仍是对 1 的未结义务**。F-2-2 末注:**即使 `PITCH_MAX` 被口径错配为 ≥ 90°,`YawBasis` 照常按式返回、不抛异常** —— 它不知道俯角上限,也不该知道"

