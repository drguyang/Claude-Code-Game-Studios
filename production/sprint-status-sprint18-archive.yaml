  # 登记缘由:S18-1 / S18-2 的「实施期义务」经逐条实测,三条能落(已落:kind 字段 +
  # R1_CHECK_31 + 22 处夹具 / 零值守卫 / ADR-025 §①:112 加注),**实现本体四条前置全缺**。
  # 性质分两类:①② 缺**数据与数值裁定**,③④ 缺**架构登记**。禁自造凑绿。
  - id: "PRE-S18-A"
    item: "伤情数据行不存在 —— `kind: injury` 白名单五项无载体"
    status: "⛔ 阻塞 S18-1 的 AC ③(破例条件)"
    evidence: "`grep -rn 'INJ_' assets/data/` ⇒ **0 个文件命中**;registry 唯一实数据 = `{ DiseaseId = 1, DiseaseKey = \"fallback\" }`(`CompositionRoot.cs:666` / `CompositionRootServices.cs:265`),`CompositionRoot.cs:13` 自陈「`disease_registry.json` 未建(数值轮未开)」"
    detail: "R2 的 11 项 `INJ_*` 只存在于 `disease-simulation.md:362-375` 的**表**里,零数据行 ⇒ 白名单 `{INJ_STAB, INJ_LACERATION, INJ_HEMORRHAGE, INJ_CLAW, INJ_BITE}`(OQ-S18-1 已裁)仍**悬空**。⚠️ 且 `kind: injury` 行按 GDD `:829-831` **另须** `SCALE_d` + `trauma_half_life`,后者上界受 `HALF_LIFE_MAX` 约束而**数值归 OQ-25-7 用户自裁** ⇒ 不是「加一个字段」而是「加三个字段 + 等一个数值裁定」"
    owner: "数值轮(用户)"

  - id: "PRE-S18-B"
    item: "F4 三个常量缺值 / 未登记"
    status: "⛔ 阻塞 S18-1 死亡支与 S18-2 的 F4 关联判据"
    evidence: "`.cs` 命中:`RECOVER_THRESHOLD` **0** · `CARE_GAP` **0** · `TREATMENT_WINDOW` **0**;`entities.yaml`:`RECOVER_THRESHOLD`(`:1559`)/ `CARE_GAP`(`:1663`)value 均为「**待定 —— 见 disease-simulation.md Tuning Knobs**」,`TREATMENT_WINDOW` **无独立 `name:` 块**(仅 `:662` 的 `variables:` 列表引用)"
    detail: "⚠️ 另发现:`DEATH_THRESHOLD` / `COMA_THRESHOLD` / `CRITICAL_THRESHOLD` **亦无独立 `name:` 块**(registry 未登记),值只活在 `StateMachine.cs:14-16`(9000 / 6000 / 3000)⇒ 「registry 是唯一真源」在这三个量上**不成立**。此为本轮新发现的登记缺口,与 G-1 同族"
    owner: "数值轮(用户)+ 9 的 GDD 轮(补登记块)"

  - id: "PRE-S18-C"
    item: "`Folded` 条件 ① 终态无事件载体 —— 病人痊愈 / 死亡在病史流里没有 Kind"
    status: "✅ 已裁 2026-10-21(方案 A)· 已落盘"
    evidence: "病史流 14 个 Kind 实测枚举:`CareApplied` / `CompoundTriggered` / `CompoundExpired` / `InjuryOnset` / `EmergencyAttempt` / `EmergencyTreatmentApplied` / `DrugTreatmentApplied` / `DiseaseOnset` / `EventRolled` / `EventArrived` / `ThreatDeferred` / `ThreatDeferralCleared` / `HistoryFlagChanged` / `SkillGrown` —— **零个是终态标记**"
    detail: "最接近的 `InjuryStateChanged` 是 **`stream: world`**(`entities.yaml:2279`),且其 `payload_schema:2281` / `constraint:2282` 明写「病人侧由 9 的病史流**既有 Kind** 承载」—— **那个「既有 Kind」不存在**。`persistence-service.md:320` 把 `终态(p)` 归 9 的 AC-36,而 AC-36(`disease-simulation.md:1924`)只说「终态(痊愈/死亡)可折叠」,**不给事件载体** ⇒ 终态**不可从流重算**,与 ADR-016 §一「决策可从三源重建」的前提冲突。须裁:立新病史流 Kind / 复用既有 / 改折叠读侧"
    owner: "用户(裁定)+ 9 的 GDD 轮 + ADR-024 registry 增列"
    ruling: "**方案 A —— 立新病史流 Kind `PatientOutcomeChanged`**(用户 2026-10-21 裁定)。权威件 = `docs/architecture/adr-032-patient-outcome-kind.md`。载荷 `(patient_id, disease_id, outcome, seq)`,`outcome ∈ {Recovered=1, Died=2}`(0 = 漏填哨兵,解码期拒收),写者 = 9,落病史流。**`t_end` 不进载荷** —— 它就是事件头部的 `Tick`(ADR-032 ④a)。**`disease_id` 必带** —— F4 的 `d` = argmax(`disease-simulation.md:1120`),终态是逐病种结论(④b)。有界性 = 每病人每病种至多一条(终态是吸收态),扩 ADR-008 §六 不重写(⑤)。条件 ① 消费口径 = **存在性查询**,不重放 F4(⑥)"
    landed: "2026-10-21 —— ADR-032 新建 · entities.yaml 增列 · EventKind.cs 35→36 · PatientOutcomeChangedPayload + PatientOutcome 枚举 · PayloadCodec(.History) 编解码 · PayloadEncoder 分派 · kindgen 重跑(A1–A5 全过,产物 diff 仅两行)· WriterExistenceGate 豁免表挂债 · drug_event_test 闭集哨兵 35→36 · 新增 patient_outcome_kind_test(13 测)"
    residual: "**9 的终态写者未落**(`WriterExistenceGate` 已具名挂债)—— 9 须在 F4 判出终态的那一 tick **原子写出**;漏写 ⇒ 该病人永不折叠,且**无机械门可扫**(唯一反查判据 = 「`Folded(p)=false` 而 F4 重放为终态」)。另:`|D_max|`(有界性第二因子)归 9 的 GDD;`Folded(p)` 本体归 S18-2"
    rejected: "Alt 1 立两个 Kind(零独立信息)· Alt 2 升格 `threshold_transition`(registry 结构冲突 + 有界性 ≤2→≤9)· Alt 3 读快照(循环依赖 + 违反 ADR-016 §一 三源不变量)· Alt 4 只发死亡(AC-36 两态并列 + 痊愈重放与折叠目的矛盾)· Alt 5 复用 `InjuryStateChanged`(世界流永不折叠)"

  - id: "PRE-S18-D"
    item: "`SelfLimited` / `LethalFor` 的 `lethal` 形参类型未统一"
    status: "✅ 已结 2026-10-22(QA 条件 C-7)· 口径 = `Lethality > 0`"
    evidence: "`RegistrySchema.cs:398-401` 自陈:既有字段是 `Lethality ∈ [0,3]` 整数,GDD R1 表写 bool `lethal`,「字段错位属既有 16 字段问题」;既有先例是 `Lethality > 0` 代 `lethal`(`R1_CHECK_22` 校验即如此写)"
    detail: "F4 的 `LethalFor(entity, d)` 若取 `d.Lethality > 0`,则 OQ-S18-1 裁的「双条件 `lethal(d)` ∧ 五项闭集」中 `lethal(d)` 的语义 = `Lethality > 0`;**若取 bool 则须先改字段类型**(牵动 22 处夹具 + R1-06 校验)。二选一须明写,否则谓词签名与既有校验打架"
    owner: "编排方(建议:`Lethality > 0`,承既有先例)—— 待用户确认"
    ruling: "**✅ 2026-10-22 结案 —— 取 `Lethality > 0`**(bool 字段案否决:牵动 22 处夹具 + R1-06 校验,且与 `R1_CHECK_22` / `EntityDeathGates.LethalityOf` 两处既有先例冲突)。**结案形式须如实登记**:本条原文写「待用户确认」,而实施轮(`fc1705d` / `ad7316c`)已按 `Lethality > 0` 落码 = **实现先于裁决**;本轮由用户 2026-10-22 指示「三条条件一并落掉」而结案,口径按**现行实现**确认。⚠️ **若改判 bool 字段,本条立即失效**,改动落点 = `Sim/EntityDeathGates.cs` 的 `LethalityOf` + `Sim/FoldedPredicate.cs:123` 的 `entry.Lethality <= 0` + 22 处夹具 + R1-06 校验。"

