  # ── F-23-3: 拆除返还 (modular-building.md §Formulas) ─────────────────────
  # 与 20 的结算边界:返还失败 = DropSpawned(EC-23-11),不静默吞。
  - name: structure_refund
    status: active
    source: design/gdd/modular-building.md
    referenced_by:
      - design/gdd/modular-building.md       # 23:F-23-3 + 规则九 + AC-23-16
      - design/gdd/item-database.md          # 21a:cost(m)(模块目录的建造材料数)
    variables:
      - cost(m)                    # 模块建造材料数(目录数据,归 21a)
      - DEMOLISH_REFUND_RATIO      # 返还率(Q16.16,0 < R ≤ 1;**P0 恒 = 1**;P1a 恢复 < 1)
      - Refund(m)                  # 返还 20 的 build_part 数(int ≥ 0)
    output_range: ["0", "cost(m)"]
    expression: "Refund(m) := ⌊cost(m) × DEMOLISH_REFUND_RATIO⌋   # 整数向下取整;Q16.16 求值 = (cost × rawR) >> 16"
    notes: "**P0 裁定(2026-09-17 评审)**:R = 1 ⇒ 重排净零材料损耗,代价走拟物轴(BUILD_TIME / 医馆停诊,
