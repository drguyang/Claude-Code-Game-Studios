      - "45 网络层"            # 传输两条逻辑流
    adr: docs/architecture/adr-008-case-event-stream.md
    signal_signature: "IEventSink.Append(in SimEvent e) — Kind ∈ {病史类} → 病史流;Kind ∈ {CaseOpened/CaseClosed/PatternRecognized/JudgmentRecorded/JudgmentRevised} → 病例流;Kind ∈ {Structure*/Drop*/Craft/ResourceHarvested/ActorCellEntered/PoiStateChanged/EncounterStarted/EncounterEnded/PlayerDied} → 世界流(ADR-009 §三 · Amendment G · ADR-021 · **Amendment H** · **Amendment L**)"
