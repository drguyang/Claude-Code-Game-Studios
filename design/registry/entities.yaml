  # ── F-24-1: 环境调制乘子 (clinic-machine.md §Formulas) ────────────────────
  # 线性加权和 + **唯一钳制点 = 21a F1**(2026-09-20 D-21-31 口径:24 侧删除双钳制,
  # 输出未钳制 env_score;18 原样透传;求和后由 21a 统一 clamp 到 [ENV_MOD_MIN, ENV_MOD_MAX])。
  # ⚠️ 本条 revised 2026-09-17 系 clinic 侧回刷前口径,2026-09-20 批次二一致性检查(S-4)订正。
  - name: env_mod
    status: active
    source: design/gdd/clinic-machine.md
    referenced_by:
      - design/gdd/clinic-machine.md       # 24:F-24-1 + 规则四/五 + AC-24-01
      - design/gdd/disease-simulation.md    # 9:恢复速度修正入口(EnvMod 不进 F4 照护判定,集群 B2)
      - design/gdd/item-database.md         # 21a:F1 运行时入参(EnvMod 可负)
      - design/gdd/player-controller-and-movement.md   # 1:不读 EnvMod(只收 K_CONTEXT_MAX)—— F-1-8
    variables:
      - base_env(room_type)        # 房间基础环境(CONTEXT_TABLE,规则三)
      - e_env(type)                # 单件家具环境贡献,可负(FURN_TABLE)
      - adj_sum                    # 邻接修正(整数 4 邻接,ADJ_TABLE;每条边恰计一次)
      - ENV_MOD_MIN / ENV_MOD_MAX  # 钳制量程(21a 常量,复用)
    output_range: ["ENV_MOD_MIN", "ENV_MOD_MAX"]   # 钳制后终值域;24 侧产出为**未钳制** env_score(见 expression 第 1 行)
    expression: |
      # 两阶段(D-21-31 单一钳制点口径,2026-09-20 回刷):
      env_score(24) := base_env(room_type) + Σ_{c∈S} e_env(type(c)) + adj_sum   # 24 输出,未钳制,可越界(EC-24-03 规格)
      EnvMod(终值)   := clamp(EnvMod_climate + EnvMod_clinic, ENV_MOD_MIN, ENV_MOD_MAX)   # 唯一钳制点 = 21a F1
    notes: "纯函数、Q16.16;房间空 / 未匹配 ⇒ ROOM_NONE ⇒ 输出中性 (0,0)(EC-24-01/02)。
      ⚠️ 2026-09-20 S-4 订正:24 **不再自带 clamp**(原 revised 2026-09-17 的表达式在 24 侧钳制 = 双钳制回归,
      与 `AC-24-01` / D-21-31 冲突)—— 24 只产未钳制 `env_score`,18 原样透传,求和 + 钳制唯一落 **21a F1**。
      clamp 越界从意外变规格(EC-24-03)。int64 算术域前置:max|env_score_raw| ≤ |base_env| + n·C_max + 2n·Φ,
      其中 `Φ := max(|W_MIN|, W_max)`(**双向取模** —— 2026-09-17 复核订正,原只写 W_max 会低估负权一侧);
      依赖格数上界 n_max → 6 复核点(O-24-2)。兑现 O-23-4(P0 最小邻接判定 = adj_sum 整数 4 邻接)。
      `ENV_MOD_MIN < 0` 为承重前提(O-24-4 —— 否则满污染房间钳到 0 = 与 ROOM_NONE 恒等值不可分)。"
    added: 2026-09-17
    revised: "2026-09-20 S-4(批次二一致性检查):删除 24 侧钳制,改两阶段单一钳制点(D-21-31);was 2026-09-17 int64 上界 `Φ := max(|W_MIN|, W_max)`(双向取模订正)"

