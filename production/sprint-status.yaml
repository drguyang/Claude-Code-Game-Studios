    landed: "`Sim/FoldedPredicate.cs` `Terminal()` 改全称 + 文件头注两处加注;`design/gdd/persistence-service.md` F-7a-4 条件① 格加注 + `OQ-7a-10` 表行标删除线;`docs/architecture/adr-032-patient-outcome-kind.md` §六 加注;新增 **6** 条测试(`test_folded_multiDisease_partialTerminal_isNotTerminal` / `test_folded_multiDisease_allTerminal_isTerminal` / `test_folded_noOnsetAtAll_isNotTerminal_notVacuouslyTrue` / `test_folded_orphanOutcome_throwsInsteadOfBeingSwallowed` / `test_folded_orphanOutcomeAlongsideValidOnset_throws` / `test_fold_multiDisease_partialTerminal_erasesNothing` —— 末条为端到端,断言「不折 ⇒ 流逐条保留」)"
