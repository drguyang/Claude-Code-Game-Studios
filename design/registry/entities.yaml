# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  # ── F1: 配方结算 (item-database.md §Formulas) ──────────────────────────
  # 唯一求解器。18 炮制 / 19 制作只传输入参数,不得自建实现
  # (systems-index.md §9 C5 的推广)。
  - name: recipe_settlement
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      # 18 / 19 GDD 尚未撰写 —— 撰写时须回溯追加
    variables:
      - outputs[].qty               # 逐条产出基数(原 Recipe.BaseQty 单数已废 —— 三轮 blocking #2)
      - QtyMultiplier
      - SkillMod
      - QualityMod
      - EquipMod
      - EnvMod
      - QTY_MULT_MIN
      - QTY_MULT_MAX
    output_range: ["1", "max(1, Round(outputs[].qty * QTY_MULT_MAX))"]
    expression: "OutputQty_i = max(1, Round(outputs_i.qty * clamp(1 + SkillMod + QualityMod + EquipMod + EnvMod, QTY_MULT_MIN, QTY_MULT_MAX)))   # 逐条套用;QtyMultiplier 是配方级"
    notes: "⚠️ 2026-09-14 二轮修正(blocking #1):原文断言「QTY_MULT_MIN 必须 > 0 ⇒ 求解器数学上不可能产出零」【为假】——
      Round(1 * 0.3) = 0。非零性不能靠 QTY_MULT_MIN 的取值获得,必须【结构性】由 max(1, ·) 兜住。
      故 QTY_MULT_MIN 允许 ≥ 0(constraint 已放宽);下界恒为 1,与 QTY_MULT_MIN 取值无关。
      修正项采用「相加后乘」而非「逐项相乘」,以消除叠加顺序依赖。
      ⚠️ 顺序无关性的【前提】是定点域(ADR-005),不是自明的 —— 见 AC-21a-4。
      ⚠️ 前提前提:Σ(正的 cap) + max(0, ENV_MOD_MAX) ≤ QTY_MULT_MAX − 1,否则高投入段被静默截断(AC-21a-9)。
      ⚠️ 2026-09-14 三轮修正(blocking #1,5/7 专家命中):【守恒律的两侧都封】——
      构建期上界须写 QTY_MULT_MAX × Σ(w × outputs_i.qty) ≤ EFF_MAX × Σ(w × inputs_j.qty),
      运行期须写 Σ(w × OutputQty_i) ≤ EFF_MAX × Σ(w × ActualConsumed_j)。
      原登记式(仅裸计数、两侧基数)【漏了产出侧的 QtyMultiplier 上界】,可被运行期击穿:
      w_in=10, w_out=9, EFF_MAX=1, QTY_MULT_MAX=2 ⇒ 构建期 9≤10 ✓ 而运行期 18>10 ✗(凭空造物)。
      ⚠️ 2026-09-14 三轮修正(blocking #2):Recipe.BaseQty【不是配方级标量】——
      配方是 outputs[],BaseQty 逐条即 outputs_i.qty。原 registry 与 GDD F1 写单数、GDD Schema F 写复数,是【形状断裂】。
      投入端另有 EFF 出口:ActualConsumed = Ceil(inputs[].qty / EFF)(D-21-15,见 efficiency / EFF 条目)。
      ⚠️ 修正曲线须在 Q16.16 原始整数域求值,不在 int 域 —— SkillMod = cap × Level / SKILL_CAP 若按 int 算,
      Level < SKILL_CAP 时恒为 0(0.3×30/60 整除 = 0),曲线退化成两段阶跃(三轮 blocking #6)。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F2: 品级传导 (item-database.md §Formulas) ──────────────────────────
  - name: quality_transmission
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      # 18 炮制 GDD 尚未撰写 —— 撰写时须回溯追加
    variables:
      - InputQuality
      - CraftSkill
      - Retain
      - RETAIN_MIN
      - RETAIN_MAX
      - SKILL_CAP
      - MAX_QUALITY
      - EFF_MIN
      - EFF_MAX
    output_range: [1, "InputQuality"]
    expression: "OutputQuality = clamp(Round(InputQuality * Retain(CraftSkill)), 1, InputQuality)
      ; EFF = EFF_MIN + (EFF_MAX − EFF_MIN) * (CraftSkill / SKILL_CAP)"
    notes: "clamp 上界是 InputQuality 而非常量 MAX_QUALITY —— 这就是裁决 Q3 的
      「输入定上限,技能定能保住多少」。上界若放开到 MAX_QUALITY,玩家即可用低品级
      原料刷品级,使采集技能的高品级识别能力失去意义(item-database.md AC-21a-2 验证此点)。
      ⚠️ 2026-09-14 修正:原 output_range 上界写作 MAX_QUALITY 是【笔误】——
      与同一行的 expression clamp 到 InputQuality 直接矛盾(已由 creative-director 判为登记笔误)。
      ⚠️ 2026-09-14 新增:EFF 转化效率(规则八 / D-21-10)—— 本式是它的定义处。
      守恒律【已修正为加权式】(三轮 blocking #1):
        Σ(w × outputs_i.qty) ≤ EFF_MAX × Σ(w × inputs_j.qty)   [构建期上界,产出侧须含 QTY_MULT_MAX]
        Σ(w × OutputQty_i)   ≤ EFF_MAX × Σ(w × ActualConsumed_j) [运行期]
      原文「Σ outputs ≤ Σ inputs × EFF_MAX」是【裸计数】(量纲不齐,异质 item_key 无可加分母)且【漏产出侧乘子】。
      EFF_MIN 的下界是硬的:∈ (0, EFF_MAX] —— EFF=0 ⇒ 运行期除零,EFF<0 ⇒ 实耗为负(三轮 blocking #6)。
      EFF_MAX ≤ 1 为硬约束(AC-21a-40)。
      退化为阶跃函数的批评(60 级只落 2 档)已登记,director 未判 blocking。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F5: 品级 → 药效时间轴 (item-database.md §Formulas) ─────────────────
  # 品级的【非数量出口】(D-21-11 / 用户裁定②;2026-09-14 二轮换轴)。
  # ⚠️ 二轮大修:原式调 Offset【幅值】—— 幅度是可被玩家换算成数值的维度,
  # 撑不起锚点二「品级的质地」。已换为【时间轴 / 作用点】(D-21-14):
  # 品级偏移 onset / peak / half_life / elimination 之一(由 quality_axis 指名),永不调幅值。
  - name: quality_timeline
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      # 11 处方 / 9 疾病与伤情 —— 接通时须回溯追加(D-21-11)
    variables:
      - quality_axis               # 枚举:【P0 只有 half_life】;onset|peak|elimination 标 P1a(三轮 D-21-23)
      - Axis_base                  # quality_axis 所指那条轴的基础值,Q16.16 Fix(P0 = half_life,与 9 的 tau_half 同源)
      - axis_offset_by_quality     # Q16.16 int[] 档位表,长度 = MAX_QUALITY
      - MAX_QUALITY
    output_range: ["Axis_base + min(axis_offset_by_quality)",
                   "Axis_base + max(axis_offset_by_quality)"]
    expression: "Axis_effective = Axis_base + axis_offset_by_quality[quality − 1]"
    notes: "【时间轴 / 作用点,不是幅值】—— 品级改的是「起效早晚 / 峰值早晚 / 半衰期长短 / 消除快慢」,
      玩家感到的是「这剂起效更慢但更久」,不是「这剂数字更大」。
      【永不调幅值】:本式不触碰 drug_potency / polarity —— 幅值是【静态基础值】,归 21a 的 drug_profile
      (D-21-22,原 Offset 改名);品级只调时间轴。
      【只动一条轴】:quality_axis 指名的轴偏移,其余三条时间轴逐位不变(AC-21a-38)。
      【P0 至少一档非零】:全零 ⇒ 锚点二在 P0 落空,AC 不得替它背书(AC-21a-37)。
      ⚠️ 2026-09-14 三轮修正(blocking #4, D-21-23):quality_axis 在 P0【收窄为 half_life】——
      9 的处置载荷只有 polarity / Offset / half_life(=tau_half)三项,onset/peak/elimination【产出即被丢弃】。
      枚举写四值而实际只一值是最难查的静默;P0 构建期拒绝非 half_life 取值(AC-21a-60)。
      ⚠️ 2026-09-14 三轮修正(blocking #5, D-21-24):加【可感知地板】——
      非零档 |offset| 必须 > 9 的病史噪声带,否则偏移统计上不可区分于噪声 ⇒ 玩家永远感觉不到,
      而 U-1/U-2 禁数字 ⇒ 出口名存实亡。地板数值须与 9 的噪声带宽一起定(AC-21a-61)。
      成药侧的品级定性感知另立 drug_quality_character[](D-21-24,U-6),与原料侧 quality_character[] 成对。
      ⚠️ 本式让品级进入 ADR-005 的定点域 ⇒ 档位表必须为 Q16.16 int、禁 float(ADR-006 §Decision 二 / AC-21a-51)。
      ⚠️ 域钳制:Axis_base + min(axis_offset_by_quality) 必须 > 0 —— 9 用 half_life 作除数,
      推到 ≤ 0 即除零 / 反向衰减(三轮补,AC-21a-38b)。
      ⚠️ 与 Recipe.min_quality 的关系:min_quality 是【准入闸】,不是出口;
      两者理由不同(闸门制造取舍,轴偏移制造回报),不可互相替代(item-database.md 规则五)。"
    added: 2026-09-14
    revised: 2026-09-14

  # ── F1: 事件抽取 (random-events.md §Formulas) ──────────────────────────
  - name: event_roll
    status: active
    source: design/gdd/random-events.md
    referenced_by:
      - design/gdd/random-events.md
      # 27 敌人 AI GDD 尚未撰写 —— 撰写时须回溯追加(52 决定来不来,27 决定来了怎么动)
    variables:
      - W_base
      - 档占比
      - TODMult
      - HistoryMult
      - ReputationMult
      - KeyGate
      - CarryLoad
      - RelevantSkill
      - SoloFlag
      - EcoTier
      - W_strength
      - StrengthCap
      - MIN_tier
      - MAX_tier
    output_range: ["MIN_tier", "MAX_tier"]
    expression: "① 档占比[] → 各档配额(无放回) ② W_i = W_base_i × TODMult_i × HistoryMult_i(KeyGate 未过 ⇒ W_i = 0);p_i = W_i / ΣW_j ③ StrengthRaw = Σ(归一化(PlayerState) × W_strength) → clamp(MIN_tier, MAX_tier) → StrengthCap = min(StrengthTier, f(最高格斗线, 急救)) ④ 过密度预算 ⇒ 生成"
    notes: "进度锁 = 行医进度(声誉 / 救人数 / 生态区解锁),不是杀怪进度 ——
      这是本作对英灵神殿最关键的一处改写:盯上你的人不是因为你强,是因为你「有用」。
      ⚠️ 2026-09-14 复核 blocking #2:乘子必须【逐条】,不能是【全池标量】——
      标量 k 在 p_i = w_i·k / Σ(w_j·k) 中被恒约去,对分布零作用;
      故 ReputationMult 改为【按档非对称数组】{机会: R_opp, 反应: R_react, 威胁: 1, 灾难: 1},
      R_opp 与 R_react 是两个独立参数、由 31 共同驱动(「一个数两个方向」的机制实现)。
      ⚠️ 2026-09-14 复核 blocking #6:抽池在先、定档在后 —— 强度【不是】抽一的乘子。
      ⚠️ 2026-09-14 复核 blocking #7:PlayerState 各项【必须先归一化到 [0,1]】,
      否则 CarryLoad(10²–10³)会以 1–2 个数量级淹没 RelevantSkill(1–60);
      StrengthCap 是上限帽(带药多不得强过自身格斗/急救量级)。
      P0 的 EcoTier 权重恒为 0 —— 本作是固定世界,空间纵深轴失效(concept-benchmark.md:60);
      深水线由 5/17 交付,52 只登记归属(见 random-events.md Dependencies)。
      ⚠️ 随机源见 DC-1:SplitMix64(WorldSeed, t, k),禁 UnityEngine.Random(AC-52-06/07)。
      全量数值为 Fix / int,禁 float(AC-52-08 / ADR-006)。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F3: 损毁与重建成本 (random-events.md §Formulas · P1a) ─────────────────
  - name: rebuild_cost
    status: active
    source: design/gdd/random-events.md
    referenced_by:
      - design/gdd/random-events.md
      # 23 建造 GDD 尚未撰写 —— 撰写时须回溯追加
    variables:
      - FullCost_mark
      - SALVAGE_RATE
      - SALVAGE_RATE_RAZED
      - DamageRatio
      - DAMAGE_MIN
      - base_cost
    output_range: ["0", "FullCost_mark"]
    expression: "RepairCost = Σ(base_cost × DamageRatio) − SalvageValue;SalvageValue = Σ(base_cost × DamageRatio × SALVAGE_RATE);RebuildCost_mark = FullCost_mark × (1 − SALVAGE_RATE);RebuildCost_razed = FullCost_mark × (1 − SALVAGE_RATE_RAZED)"
    notes: "⚠️ 2026-09-14 复核 blocking #9 修正三处边界退化:
      ① SALVAGE_RATE 由 (0,1] 收为 (0,1) —— 含 1 ⇒ RebuildCost = 0,重建免费 ⇒ 焚毁档失去全部 stakes,
         且玩家可反复故意焚毁刷布局;构建期直接拒绝 1。
      ② 补回收项 —— 原 RepairCost 无 SalvageValue,导致 DamageRatio = 1 时
         RepairCost(= FullCost)> RebuildCost ⇒ 【修不如拆,维修被严格支配】,与「就地修补」承诺相悖(AC-52-34)。
      ③ 焚毁档原无成本式 ⇒ 补 RebuildCost_razed 与 SALVAGE_RATE_RAZED(回收率更低)。
      另:DamageRatio ∈ [DAMAGE_MIN, 1) 且 DAMAGE_MIN > 0(= 0 即「零成本复原」);AC-52-35 守边界。
      「受损 / 摧毁 / 焚毁」三档同时是 52 与 23 之间的接口契约。
      另:脉案 / 已学知识 / 技能等级永不被损毁夺走(兑现 game-concept.md L270;AC-52-33)。
      ⚠️ 本式【P1a】—— P0 威胁档不打建筑、P0 无地图 #43,规则七在 P0 无触发源(规则七注)。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F1: 病程求值 (disease-simulation.md §Formulas) ─────────────────────
  # 全案唯一一条病程曲线。9 是唯一持有者;11 处方只产出 Offset,不得自建曲线。
  - name: disease_progression
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      # 11 处方用药 / 13 病人 AI / 24 医馆即机器 GDD 尚未撰写 —— 撰写时须回溯追加
    variables:
      - A_peak
      - incubation
      - tau_rise
      - tau_fall
      - tau_peak
      - self_limit
      - plateau
      - A_rel
      - relapse_interval
      - tau_rel_fall
      - tau_half          # 属 11/21a 的 drug_profile,不属病种注册表(见 notes)
      - sigma
      - Offset            # 由 11 处方产出,9 只消费
      - Noise             # SplitMix64 查表哈希,不持 PRNG 状态
    output_range: ["0", "无上界(clamp 下界 0)"]
    expression: "clamp( (Base(τ) ⊔ Relapse(τ)) + Σ Offsetᵢ×Decay(t−tickᵢ) + Noise(seed,t), 0, +∞ ), τ = t − onset_tick"
    notes: "两条不可动摇的约定,实现前必读:
      (1) 【时间原点】τ = t − onset_tick,τ_rel = relapse_interval × (复发次数+1) ——
          Base 与 Relapse 共用相对时基,全式只有 t 一个绝对量。
          早期草稿写作 t_rel = onset_tick + …(绝对量)与相对量的 τ 相减,会把首次复发推到负时刻。
      (2) 【括号】⊔(取大)只作用于 Base 与 Relapse 两条曲线,Σ Offset×Decay 与 Noise 在括号外相加。
          复发与处置偏移重叠时取大不取和 —— 相加会让病情假性叠加。
      (3) tau_half 衰减的是【处置偏移】不是【病情】,故归 11 处方 / 21a 的 drug_profile(D-21-6),
          不登记在病种注册表:病种定义「病怎么走」,药定义「药怎么退」。
      曲线参数 schema(含禁止写 AnimationCurve 的理由)见 disease-simulation.md R1.3。"
    added: 2026-09-13
    revised: ""

  # ── F2: 体征投影 (disease-simulation.md §Formulas) ─────────────────────
  - name: sign_projection
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      # 8 诊断与体征揭示 GDD 尚未撰写 —— 撰写时须回溯追加(读 position/trend 的门槛归它)
    variables:
      - Progress
      - SCALE_病种
      - W                 # trend 中心差分窗口
      - 对症处置偏移
    output_range: ["position: 0", "position: 1"]
    expression: "position = clamp(Progress(t)/SCALE_病种, 0, 1) ; trend = (Progress(t+W/2) − Progress(t−W/2))/W"
    notes: "规则三「病情/体征两层」的机制实现:Progress 只被【对因】处置改,Signⱼ 被【对症】处置改 ——
      柳树皮降热但不改病情,金鸡纳皮改病情。
      trend 用【中心差分】而非一阶差分:处置发生在窗口内时一阶差分跳变,玩家会看到「突然变坏」的假信号;
      中心差分天然抵消对称跳变,且解析式求值免费。
      trend 不在 output_range 内 —— 它未归一(单位是「每 tick 的进度变化」),符号是唯一有意义的读数。
      ⚠️ 本公式【不含可读性判定】—— READ_FLOOR / BASE_READ / 技能→精度映射曲线于 2026-09-14
      迁至 8 诊断(门槛是玩法决策,不是模拟决策;且 9 若按技能过滤会破坏 ADR-005 逐位一致)。
      9 无条件出 position/trend 真值,BASE_READ 不再是本公式的变量。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F3: 定 tick 与离线补算 (disease-simulation.md §Formulas) ───────────
  - name: catchup
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      # 7a 持久化服务 GDD 尚未撰写 —— 撰写时须回溯追加(authority-agnostic,C6)
    variables:
      - TICK_SECONDS
      - sigma
      - boundary_mode
      - FIXED_ITER
    output_range: ["0", "类A边界数 + 每子区间 log(区间/步长)"]
    expression: "t = ⌊GameClock / TICK_SECONDS⌋ ; CatchUp 枚举类A闭式边界 → 切子区间 → 保守带|Noise|≤σ 外跳过/内二分 → 写回缺失病史事件"
    notes: "复杂度不随离线时长线性增长 —— 这是规则二「O(处置次数)」的落地。
      ⚠️ 该复杂度【不是自动成立】的,由三条共同保证:① 类A边界有具名闭式
      ② 类B用保守带 ③ 每个病种登记 boundary_mode。缺任一条,F3 会悄悄退化成扫描。
      boundary_mode 必须【登记为数据】(规则九),否则会在第 4 个月做存档时才发现某病种不可闭式求解
      —— systems-index.md §8 标的正是这个爆点。
      FIXED_ITER 保证「确定终止」,不保证「收敛到正确根」:固定迭代只解决确定性,不解决正确性。"
    added: 2026-09-13
    revised: ""

  # ── F4: 阈值与转移判定 (disease-simulation.md §Formulas) ───────────────
  - name: threshold_transition
    status: active
    source: design/gdd/disease-simulation.md
    referenced_by:
      - design/gdd/disease-simulation.md
      # 13 病人 AI / 34 公卫与疫情 GDD 尚未撰写 —— 撰写时须回溯追加
    variables:
      - CRITICAL_THRESHOLD
      - COMA_THRESHOLD
      - DEATH_THRESHOLD
      - TREATMENT_WINDOW
      - self_limit
      - lethal
      - position
      - last_effective_treatment
    output_range: ["潜伏|发病|进展|好转|迁延|危殆|昏迷|痊愈|死亡"]
    expression: "在 tick 采样点上判定,不求根 ; 死亡 ← lethal ∧ self_limit=false ∧ position≥DEATH_THRESHOLD ∧ (t − last_effective_treatment) > TREATMENT_WINDOW"
    notes: "【铁律一:死亡必须被挣得】在公式层的实现 —— 三个条件缺一不可:
      (1) self_limit = false —— 否则自限性病也「时间到就死」,那是伪装违反;
      (2) last_effective_treatment 只认【对因】处置 —— 否则对症药刷新死亡窗口,
          玩家能用柳树皮「续命」,那是伪治疗;
      (3) last_effective_treatment 为空时【取 onset_tick 哨兵】—— 缺哨兵则「从未被治过」的病人
          该项无定义,死亡判定整条短路,而「见死不救」正是它要覆盖的情形。
      放弃求根的理由:Noise 破坏单调性、Offset 在 t=tickᵢ 处引入导数跳变,二分可能失效或收敛到错误的根。
      9 的状态转移本就是 tick 离散的,采样点判阈值足够。"
    added: 2026-09-13
    revised: ""

