      （1 侧据此把退化分支保留为**防御性代码**，不再作为待裁项）。**该义务未结**。
      ⚠️ **2 侧仍须防御性兜底**（F-2-2 末注）：即使口径被错配为 ≥ 90°，`YawBasis`
      **照常按式返回、不抛异常** —— 它不知道俯角上限，也不该知道。
      ⚠️ **`Casebook` 档的固定姿态是另一个常量**（`PITCH_CASEBOOK`），不是本条的档位值 ——
