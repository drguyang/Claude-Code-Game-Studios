      **判据**：`AC-2-12`（2 侧，**位移上界** —— 原「与 `dt := MAX_DT` 逐位相同」已于
      2026-09-16 撤回，因该判据会**反向强制**保留显式积分器）+ `AC-1-06a/b/c`（1 侧，
      防隧穿不等式的构建期断言）。"
