    note: "**✅ 2026-10-31 收口(retro-20 行动项 1/2 兑现;纯文书,零产品码)**。① **§3.3 追加额度两分** —— 散件额度(1 件/轮)vs 链条额度(1 条/轮,一条链 = 1 个单元不论链上几件);**链的判定法写成机械可判的一句**:「离开同批其它件就无法单独交付」才算同链;并**反向挡**「自己能单独收口却挂链蹭额度」。链条入场须显式裁定四样(链名/件数/理由/结论),**缺一即视为未裁定 = 超预留**。② **超预留三档**:散件 >2 · 链条 >1 · **单链长 >3**。⚠️ **第 3 档是本轮新立且必须说明理由**:retro-20 原文只说「超预留 2 倍」,而链按单元算时「2 倍」= 2 条链 ⇒ **sprint-20 那条 8 件单链按字面仍然合法,刹车照样不响**;故按链长另设一档。**阈值 3 是默认值,已在文内明写「不是本文件能单方面定的数」,属流程数值,若与实际体感不符由用户裁定后改**。③ **§3.4 预估三列**:`掀债` / `掀 story` / `链`;**「掀 story」不得留空,没有就写 0**(留空与「忘了估」不可区分 = retro-20 记账的失效形态)。④ **§六 补两条失败条件**:#5「整链入场但卡面缺四样之一 ⇒ 判未裁定」「#6 掀 story 留空 ⇒ 规划轮不得收口」—— 让本模型**能自己红**。⑤ **接线**:`sprint-plan` SKILL 任务表模板下加三列要求(否则又成「机制立了没打中靶」);`sprint-21.md` 变更记录写明**自 sprint-22 起生效**(本 sprint 已排完,不回填)。⚠️ **本卡的证伪面**:文档规则无编译单元可变异;可判的是**规则是否真能挡住 sprint-20 那一次** —— 按 retro-20 自己记的「8 件链」回放:该链命中第 3 档(链长 8 > 3)⇒ 触发强制二选一(**这是按文档回放,不是实测**)。**本轮未做的是**:没有拿一个真实新 sprint 走一遍新规则(那要等 sprint-22 规划),故「规则有效」仍是**未实测**,与 `TD-s13-01` 同款——**不借绿**。"

