  # ── F1: 配方结算 (item-database.md §Formulas) ──────────────────────────
  # 唯一求解器。18 炮制 / 19 制作只传输入参数,不得自建实现
  # (systems-index.md §9 C5 的推广)。
  - name: recipe_settlement
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      # ✅ 2026-09-19:18 炮制已成稿(processing.md F-18.1 调用契约,正文已引用);19 = P1a 未开始,撰写时须回溯追加
    variables:
      - outputs[].qty               # 逐条产出基数(原 Recipe.BaseQty 单数已废 —— 三轮 blocking #2)
      - QtyMultiplier
      - SkillMod
      - QualityMod
      - EquipMod
      - EnvMod
      - QTY_MULT_MIN
      - QTY_MULT_MAX
    output_range: ["1", "max(1, Round(outputs[].qty * QTY_MULT_MAX))"]
    expression: "OutputQty_i = max(1, Round(outputs_i.qty * clamp(1 + SkillMod + QualityMod + EquipMod + EnvMod, QTY_MULT_MIN, QTY_MULT_MAX)))   # 逐条套用;QtyMultiplier 是配方级"
    notes: "⚠️ 2026-09-14 二轮修正(blocking #1):原文断言「QTY_MULT_MIN 必须 > 0 ⇒ 求解器数学上不可能产出零」【为假】——
      Round(1 * 0.3) = 0。非零性不能靠 QTY_MULT_MIN 的取值获得,必须【结构性】由 max(1, ·) 兜住。
      故 QTY_MULT_MIN 允许 ≥ 0(constraint 已放宽);下界恒为 1,与 QTY_MULT_MIN 取值无关。
      修正项采用「相加后乘」而非「逐项相乘」,以消除叠加顺序依赖。
      ⚠️ 顺序无关性的【前提】是定点域(ADR-005),不是自明的 —— 见 AC-21a-4。
      ⚠️ 前提前提:Σ(正的 cap) + max(0, ENV_MOD_MAX) ≤ QTY_MULT_MAX − 1,否则高投入段被静默截断(AC-21a-9)。
      ⚠️ 2026-09-14 三轮修正(blocking #1,5/7 专家命中):【守恒律的两侧都封】——
      构建期上界须写 QTY_MULT_MAX × Σ(w × outputs_i.qty) ≤ EFF_MAX × Σ(w × inputs_j.qty),
      运行期须写 Σ(w × OutputQty_i) ≤ EFF_MAX × Σ(w × ActualConsumed_j)。
      原登记式(仅裸计数、两侧基数)【漏了产出侧的 QtyMultiplier 上界】,可被运行期击穿:
      w_in=10, w_out=9, EFF_MAX=1, QTY_MULT_MAX=2 ⇒ 构建期 9≤10 ✓ 而运行期 18>10 ✗(凭空造物)。
      ⚠️ 2026-09-14 三轮修正(blocking #2):Recipe.BaseQty【不是配方级标量】——
      配方是 outputs[],BaseQty 逐条即 outputs_i.qty。原 registry 与 GDD F1 写单数、GDD Schema F 写复数,是【形状断裂】。
      投入端另有 EFF 出口:ActualConsumed = Ceil(inputs[].qty / EFF)(D-21-15,见 efficiency / EFF 条目)。
      ⚠️ 修正曲线须在 Q16.16 原始整数域求值,不在 int 域 —— SkillMod = cap × Level / SKILL_CAP 若按 int 算,
      Level < SKILL_CAP 时恒为 0(0.3×30/60 整除 = 0),曲线退化成两段阶跃(三轮 blocking #6)。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F2: 品级传导 (item-database.md §Formulas) ──────────────────────────
  - name: quality_transmission
    status: active
    source: design/gdd/item-database.md
    referenced_by:
      - design/gdd/item-database.md
      # ✅ 2026-09-19:18 炮制已成稿(processing.md 正文引用 F1/F2 两个修正项);19 = P1a 未开始,撰写时须回溯追加
    variables:
      - InputQuality
      - CraftSkill
      - Retain
      - RETAIN_MIN
      - RETAIN_MAX
      - SKILL_CAP
      - MAX_QUALITY
      - EFF_MIN
      - EFF_MAX
    output_range: [1, "InputQuality"]
    expression: "OutputQuality = clamp(Round(InputQuality * Retain(CraftSkill)), 1, InputQuality)
      ; EFF = EFF_MIN + (EFF_MAX − EFF_MIN) * (CraftSkill / SKILL_CAP)"
    notes: "clamp 上界是 InputQuality 而非常量 MAX_QUALITY —— 这就是裁决 Q3 的
      「输入定上限,技能定能保住多少」。上界若放开到 MAX_QUALITY,玩家即可用低品级
      原料刷品级,使采集技能的高品级识别能力失去意义(item-database.md AC-21a-2 验证此点)。
      ⚠️ 2026-09-14 修正:原 output_range 上界写作 MAX_QUALITY 是【笔误】——
      与同一行的 expression clamp 到 InputQuality 直接矛盾(已由 creative-director 判为登记笔误)。
      ⚠️ 2026-09-14 新增:EFF 转化效率(规则八 / D-21-10)—— 本式是它的定义处。
      守恒律【已修正为加权式】(三轮 blocking #1):
        Σ(w × outputs_i.qty) ≤ EFF_MAX × Σ(w × inputs_j.qty)   [构建期上界,产出侧须含 QTY_MULT_MAX]
        Σ(w × OutputQty_i)   ≤ EFF_MAX × Σ(w × ActualConsumed_j) [运行期]
      原文「Σ outputs ≤ Σ inputs × EFF_MAX」是【裸计数】(量纲不齐,异质 item_key 无可加分母)且【漏产出侧乘子】。
      EFF_MIN 的下界是硬的:∈ (0, EFF_MAX] —— EFF=0 ⇒ 运行期除零,EFF<0 ⇒ 实耗为负(三轮 blocking #6)。
      EFF_MAX ≤ 1 为硬约束(AC-21a-40)。
      退化为阶跃函数的批评(60 级只落 2 档)已登记,director 未判 blocking。"
    added: 2026-09-13
    revised: 2026-09-14

  # ── F5: 品级 → 药效时间轴 (item-database.md §Formulas) ─────────────────
  # 品级的【非数量出口】(D-21-11 / 用户裁定②;2026-09-14 二轮换轴)。
