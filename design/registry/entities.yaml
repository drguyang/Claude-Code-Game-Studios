# ─── FORMULAS ────────────────────────────────────────────────────────────────
# Named calculations with defined variables and output ranges.
# Register a formula when its output feeds into another system's input,
# or when another GDD references it by name.
#
# Required fields: name, status, source, referenced_by, variables[],
#   output_range[min, max], added
# Optional: expression (the actual formula), notes

formulas:
  # ── F-23-1: 有效可走性合成 (modular-building.md §Formulas) ────────────────
  # **缝一(6 的 O-6-10)的唯一合成点** —— 6 烘焙静态 Nav,23 写入占用 Overlay,
  # 合成 = 23;27 / 13 只读合成结果,不读 Nav 原件。**本式登记即 O-6-10 闭合**。
  # ⚠️ 2026-09-17 评审裁定 B2:玩家不读合成(走感 = CharacterController collide-and-slide)。
  - name: effective_walkable
    status: active
    source: design/gdd/modular-building.md
    referenced_by:
      - design/gdd/modular-building.md       # 23:F-23-1 + 规则三 + AC-23-03/04
      - design/gdd/world-and-ecozones.md     # 6:缝一 R-6-15 + O-6-10 + AC-6-10(本式是 O-6-10 的落点)
      - docs/architecture/adr-016-ai-architecture.md   # §五 寻路输入(2026-09-17 补注);§三 感知输入
      - docs/architecture/adr-015-world-geometry-fixed-world-lattice.md   # §五 模块化网格 + §四③ 脏块失效
      # (2026-09-17 移除 player-controller-and-movement.md 引用 —— 评审裁定 B2:玩家不读合成)
    variables:
      - cell                    # 整数格坐标(WorldPos,ADR-015 §三)
      - Nav[cell].walkable      # 静态导航格(烘焙,会话内不变,R-6-13)—— 归 6
      - Overlay.blocked(cell)   # 23 的占用覆盖:该格被模块占用 —— 归 23
      - EffectiveWalkable(cell) # 合成结果:27 / 13 可走真值(玩家不读 —— 2026-09-17 评审裁定 B2)
    output_range: ["false", "true"]
    expression: "EffectiveWalkable(cell) := Nav[cell].walkable ∧ ¬Overlay.blocked(cell)"
    notes: "**推论(F-23-1)**:EffectiveWalkable = false 的充要条件 = 原生不可走 ∨ 被占用,
      与 slot_occupied 用**同一份占用表**(一个写成 Overlay,一个写成占用真相,禁两套副本漂移 —— AC-23-04)。
      **重算对象点名**:ADR-015 §四③ 的脏块失效重算 Overlay 的局部,不重算 6 的静态 Nav(会话内不变)。
      Overlay 是派生态:不进流、不存档,重放时从 **BakedInitial ⊕ Structure* 事件**重建
      (2026-09-17 评审裁定 B3:开档基线 = 烘焙初始占用;ADR-016 §一 三源不变量)。
      读方 = 27 / 13(玩家不读,裁定 B2)。"
    added: 2026-09-17
    revised: ""

  # ── F-23-2: 放置合法性判定 (modular-building.md §Formulas) ───────────────
  # 全量四条件布尔谓词;拒绝不 Append 任何事件。判定进 sim,意图 = 呈现层预览
  # (EC-23-12:取消放置 = sim 侧零事件)。
  - name: structure_placeable
    status: active
    source: design/gdd/modular-building.md
    referenced_by:
      - design/gdd/modular-building.md       # 23:F-23-2 + 规则二 + AC-23-01
      - design/gdd/world-and-ecozones.md     # 6:槽位骨架(6 只给格)
      - docs/architecture/adr-022-level-tool.md   # §三 world_buildslots.json(骨架唯一作者)
    variables:
      - anchor                # 目标锚点格(WorldPos)
      - BuildSlot(骨架)       # 允许格集 + 槽位类型(烘焙)
      - BuildSlotRegion(骨架) # 槽位骨架的区域(含初始占用;评审 B5 —— 占用格须全在区域内)
      - SlotType(anchor)      # 该格的槽位类型约束(enum)
      - module_type           # 模块目录里的类型(21a 拥有)
      - OccupiedCells(m)      # 模块占用格集(目录推导,整数旋转 F-23-2b)
      - slot_occupied(cell)   # 占用真相(23)
      - Stock(20, m)          # 20 侧可扣的 build_part 数量
      - EntityOnCell(cell)    # 该格有实体(玩家 / 敌人;量化格 + 宽容半径;评审 B4)
    output_range: ["false", "true"]
    expression: "Placeable(m, anchor) := anchor ∈ BuildSlot ∧ TypeOK(SlotType(anchor), m.module_type) ∧ ∀cell ∈ OccupiedCells(m, anchor): ¬slot_occupied(cell) ∧ ∀cell ∈ OccupiedCells(m, anchor): cell ∈ BuildSlotRegion ∧ skeleton 未变 ∧ m ∈ ModuleCatalog ∧ Stock(20, m) ≥ 1 ∧ ∀cell ∈ OccupiedCells(m, anchor): ¬EntityOnCell(cell)"
    notes: "**P0 无原子 swap**(规则二):换位 = 先拆后放两次有代价的决定,不是免费撤销。
      **结构身份 ≠ 物品身份**(规则七):structure_id 与 instance_id 是两个 id 空间,经 module_id 关联,不合并。
