      非 ADR-006 的 ROUND_HALF_AWAY_FROM_ZERO;操作数全非负、无 ties ⇒ 等价安全,须显式注为例外,
      防实现者改成 Math.Round(评审 B6)。**边界**:cost = 1 且 R < 1 ⇒ Refund = 0 —— 消耗性家具由目录
      refundable = false 显式声明(EC-23-08);P0 R = 1 时此边不触发。"
