  # 值全待定:硬约束 —— 数值归用户,本表只登记形状与归属。
  - name: horizontal_antitunneling_invariant
    status: active
    source: design/gdd/player-controller-and-movement.md
    referenced_by:
      - design/gdd/player-controller-and-movement.md   # 1:F-1-1a + AC-1-06a/b/c + AC-1-21 + Tuning Knobs 组 5
      - docs/architecture/adr-020-player-controller-and-camera.md  # §四 有界性论证的前置
      - design/gdd/camera-and-viewpoint.md   # 2:与 yaw_basis 相邻的一环 —— 基若失去单位性,本式**静默失效**(2 的 F-2-2 注 · AC-2-08)
      - design/gdd/world-and-ecozones.md     # 6:**本式约束的对象是 6 的 `LATTICE_SIZE`**（所有权反转）—— 6 的 F-6-1 / R-6-3 / AC-6-04 + §Dependencies 的跨系统调参纪律声明
      - design/gdd/clinic-machine.md         # 24:F-24-3(交付 `K_CONTEXT_MAX` 的表侧)+ O-24-2(n_max 复核点)(2026-09-17)
      # ✅ 2026-09-16:6 的 GDD 已落盘(world-and-ecozones.md),其上文「6 / 24 尚未撰写」的后半
      # (6 侧)已兑现 —— 本式在 6 侧的对应物 = `lattice_size_lower_bound`(同一条不等式,另一侧登记);
      # ✅ 2026-09-17:24 侧已兑现(clinic-machine.md F-24-3 → k_context_max;CONTEXT_TABLE / K_CONTEXT_MAX 已登记)
      # ✅ 2026-09-19:上文「24 尚未撰写」全文已过时 —— 24 已成稿,本条随 2026-09-19 一致性复跑划结
    variables:
      - SPEED_MAX        # 水平净位移速度上界(派生量)—— *待定*
      - SPEED_MODE_MAX   # 运动档位速度上限的最大值 —— P0 = SPEED_WALK(单档,系统 1 的 R7 砍掉冲刺)—— *待定*,归 1
      - K_TERRAIN_MAX    # = max(TERRAIN_TABLE 的 K_speed) —— *待定*,归 **6 的表 → 1 派生**
      - K_CONTEXT_MAX    # = max(CONTEXT_TABLE 的 K_speed) —— *待定*,归 **24 的表 → 1 派生**
      - MAX_DT           # 单帧 dt 的钳位上限(EC-6)—— *待定*,归 1
      - LATTICE_SIZE     # 格边长 —— *待定*,归 **6**（F-6-1 所有权反转;ADR-015 §三 只定义格框架）
    output_range: ["pass", "fail"]
    expression: "SPEED_MAX := SPEED_MODE_MAX × ‖MoveInput‖_max × K_TERRAIN_MAX × K_CONTEXT_MAX ;  INVARIANT : SPEED_MAX × MAX_DT ≤ LATTICE_SIZE"
    notes: "**`‖MoveInput‖_max = 1` 是硬界不是旋钮** —— 它是 3→1 边界的断言项(AC-1-09),
      1 不 clamp(掩盖 3 的 bug)。**保证的是「水平方向每帧至多跨一格」**(采样取相邻两帧的 Position;
      F-1-3 的线性趋近不过冲)⇒ 违反即**静默隧穿**:中间格永不进事件,感知有洞,不崩不报错。
      ⚠️ **2026-09-16 就地订正**(系统 1 的 GDD 首轮评审根因 4,两处):
      ① **变量用 `MAX_DT`,不是 `TICK_PERIOD`** —— 跨格检测跑在**每帧**,积分步长是 `dt`;
      用 `TICK_PERIOD` 时 `dt > TICK_PERIOD`(帧率 < tick 频率,**常态**)一帧可跨多格而断言仍成立
      ⇒ **通过而失效**。`TICK_PERIOD` 退居 F-1-1b 的**事件率**面(与位移无关)。
      ② **`SPEED_SPRINT` 已从式内移除** —— 系统 1 的 R7 把冲刺整档砍出 P0(无代价的纯提速
      ⇒ 严格支配 Walk ⇒ Walk 成死内容),P0 的 `SPEED_MODE_MAX` = `SPEED_WALK`;
      P1a 恢复冲刺时本式**重新含该档位**,并须先设计代价(OQ-1-11)。
      ⚠️ **不等式的所有者是 `LATTICE_SIZE`,不是 `SPEED_MAX`** ——
      `K_TERRAIN_MAX` / `K_CONTEXT_MAX` 归 6 / 24 的表,1 无法单方面保证该式;6 / 24 调表只是
      **抬高 `LATTICE_SIZE` 的下界**(**`LATTICE_SIZE` 归 6**,F-6-1 所有权反转;
      ADR-015 §三 只定义格框架)是唯一需要复核的点(CI 断言落 AC-1-06a/b/c)。
      **❌ 不得手填常数**:两个 MAX 须与两表**同源加载**(同一 .cooked 内派生)+ 装载期跨系统校验 ——
      手填则在 6 / 24 调表时**静默失效**(正是本式自称要防的失败)⇒ AC-1-06c 的 AST 判据禁数字字面量初始化。
      **作用对象 = 1 自己产生的位移,不是 Position 的最终变化量** —— `CharacterController.Move` 的
      collide-and-slide **会加入引擎侧滑移**(斜坡投影 / stepOffset 瞬时抬升),不在式内
      ⇒ 须补**代码级不变量**(禁止传 |delta_horiz| > SPEED_MAX × dt,AC-1-21①)
      + **运行期断言**(含滑移容差 ε_slide,量级 = 一次 stepOffset 抬升的水平分量,AC-1-21②③)。
      **y 轴显式豁免**(F-1-1c,2026-09-16 用户裁定):自由落体竖直速度可远超 SPEED_MAX。
      **推不出「≤ 1/tick」** —— tick 内折返不消耗位移预算 ⇒ 事件计数由 F-1-1b 的**运行期**不变量
      单独守住(见 SimEvent.Kind.ActorCellEntered 条目);两条不变量**不可共用一个载体**
      (本式 = 构建期静态断言;F-1-1b = 运行期计数)。
      **载体未建**:本式的 CI 断言载体(tests/ + .github/workflows/)尚不存在,由 **ADR-012** 一并建。"
    added: 2026-09-16
    revised: ""

  # ── F-2-2: 相机水平基 (camera-and-viewpoint.md §Formulas) ──────────────
  # 首次登记 2026-09-16(系统 2 的 GDD 落盘)。**登记理由 —— 本表里唯一一条
  # 「缺了会让游戏不可玩」的公式**:系统 1 的 F-1-8 靠它把二维 `MoveInput` 投影成世界方向。
  # 1 的 GDD 全程**可编译、单测可全绿**,而**移动方向无定义**(系统 1 的 `O-8`)。
  # 两条边方向相反故**无类型环**:1 读 2 的基(上游值),2 读 1 的 `Position`(下游值)。
  # ⚠️ 与 `horizontal_antitunneling_invariant` 是**相邻的两环**:本式若静默失去单位性,
  # 1 的 `v̂_world` 便失真 ⇒ 那条防隧穿断言**静默失效**(系统 1 的 `AC-1-31` 描述的失效链)。
  # 值全待定:硬约束 —— 数值归用户,本表只登记形状与归属。
  - name: yaw_basis
    status: active
    source: design/gdd/camera-and-viewpoint.md
    referenced_by:
      - design/gdd/camera-and-viewpoint.md   # 2:F-2-2 + AC-2-07…10(R-2-7)+ ADR-020 §Key Interfaces
      - design/gdd/player-controller-and-movement.md   # 1:F-1-8(唯一消费方)+ AC-1-31 + AC-1-35 ③④
      - docs/architecture/adr-020-player-controller-and-camera.md  # §Key Interfaces(ICameraRig.YawBasis)+ AC-20-14
      - docs/architecture/tr-registry.yaml   # TR-camera-006 + TR-player-005
    variables:
      - yaw       # 绕点段(②)的累积偏航角 —— 无界,2π 周期;**由 Look.x 驱动**
      - fwd       # f̂ := (sin yaw, 0, cos yaw) —— 水平前向,y ≡ 0
      - right     # r̂ := (cos yaw, 0, −sin yaw) —— 水平右向,y ≡ 0
    output_range: ["(Vector3 fwd, Vector3 right)"]
    expression: "f̂ := (sin(yaw), 0, cos(yaw)) ;  r̂ := (cos(yaw), 0, −sin(yaw)) ;  PROPERTY : f̂.y = 0 ∧ r̂.y = 0 ∧ ‖f̂‖ = 1 ∧ ‖r̂‖ = 1 ∧ dot(f̂, r̂) = 0"
    notes: "**`pitch` 不参与** —— yaw 与 pitch 解耦是本式的全部意义:俯仰时前进方向**不变**
      (这是系统 1 的 `AC-1-20a` ④ 的前提)。
      **构造即成立,不靠事后归一**:`sin² + cos² = 1` 恒等式直接给出单位性与正交性 ⇒
      **禁 `Normalize()`** —— 多一次归一化只引入浮点误差,不改善任何东西(R-2-7)。
      🔴 **手性须显式断言(2026-09-16 首轮评审 B2 副产物)**:`r̂` 是 `f̂` 绕世界 `+Y`
      **左旋** 90°(**右手系**),与系统 1 的 `r̂ := normalize(cross(worldUp, f̂))` **逐分量等价**
      (已数值验证 `cross(worldUp, f̂) = (cos yaw, 0, −sin yaw)`)。⇒ **无左右镜像**,
      但该等价**必须写在 GDD / 本条目里** —— 否则实现期各按直觉取「顺时针 90°」会引入**静默镜像**
      (`AC-2-07` ② 即该判据:逐分量等于 `normalize(cross(worldUp, f̂))`)。
      ⚠️ **只读单向**:系统 1 的调用点对相机状态 / 变换的**写入数 = 0**(只读断言,`AC-2-10`②)。
      🔴 **次序契约(评审 B5 订正)**:原文写「一帧内恒定:相机每帧只更新一次 yaw」——
      **在 Unity 中不可执行**(无强制手段)。现重述为**次序不变量**:
      **任何 `YawBasis` 消费者的读取时刻 ≥ 本帧 yaw 的更新时刻**;落点 = ADR-011 既有的
      `InputSystem.onAfterUpdate` 相位,或显式 `ICameraRig.UpdateYaw()`。
      **禁止**依赖 `Script Execution Order` 面板(场景资产、不跨 prefab、失败**静默**)
      ⇒ 对侧承诺 = 登记义务 **`O-14`**。
      **退化情形已关闭**(R-2-3 / `AC-2-09`①):装载期断言 `PITCH_MIN < 0 < PITCH_MAX < 90°`
      ⇒ 相机不可能到达垂直俯视 ⇒ 系统 1 的 F-1-8 中「`proj(f̂) ≈ 0` ⇒ `f̂` 无定义」分支
      **在正常操作下不可达**。⚠️ **只有俯侧退化**(仰侧 `pitch → PITCH_MIN` 不触发)——
      这正是评审 B2 的发现:`PITCH_MIN` 与 `PITCH_MAX` **不对称**,不是镜像。
      ⚠️ 但本式**仍须防御性兜底**:若 `PITCH_MAX` 被口径错配为 ≥ 90°,
      `YawBasis` **照常按式返回、不抛异常** —— 它不知道俯角上限,也不该知道。
      ⇒ **`PITCH_MAX` 的实际取值须回填系统 1 的 `OQ-1-14` 并结案**(登记义务 **`O-11`**,**未结**)。
      ⚠️ **容差双重定义风险**:本式的判据容差是 `YAW_BASIS_EPS`,**系统 1 的 `AC-1-31`
      须引用同一个常量实体**(现写 `[容差——待定]`,未命名)。
      **载体未建**:相关 CI 判据的载体(tests/ + .github/workflows/)尚不存在,由 **ADR-012** 一并建。"
    added: 2026-09-16
    revised: "2026-09-16"   # B2:补手性显式断言;B5:帧内恒定 → 次序不变量

  # ── F-2-1: 相机锚跟随 (camera-and-viewpoint.md §Formulas) ───────────────
  # 首次登记 2026-09-16(系统 2 的 GDD 落盘)。**登记理由**:`MAX_DT` 与系统 1 **同源**
  # —— 两条链(collide-and-slide 与临界阻尼积分)面对**同一次掉帧**必须用同一钳位值,
  # 否则「玩家瞬移过锚」或「锚瞬移过玩家」会在掉帧时二选一发生。
  # ⇒ 2 若自建第二个 `MAX_DT`,即构成**静默失配**(GDD §Tuning Knobs 组 6)。
  # 值全待定:数值归用户(ω 亦留白)。
  - name: camera_anchor_follow
    status: active
    source: design/gdd/camera-and-viewpoint.md
    referenced_by:
      - design/gdd/camera-and-viewpoint.md   # 2:F-2-1 + AC-2-11 + AC-2-12 + Tuning Knobs 组 1/6
      - docs/registry/entities.yaml          # constants.MAX_DT(同源依赖)
    variables:
      - P_player   # 系统 1 的连续位置(IPlayerMotor.Position)—— 表现态,永不写流
      - anchor     # 相机链的锚 —— 2 的内部状态,不进任何流
      - v_anchor   # 锚的速度(临界阻尼需速度项,不能用位置一阶趋近)
      - ANCHOR_RESPONSE  # ω —— 响应频率旋钮 —— *待定*,归 2
      - MAX_DT     # 单帧 dt 钳位上限 —— **归系统 1**,2 只读(GDD §Tuning Knobs 组 6)
    output_range: ["anchor → P_player(渐近,过冲有界且 ≤ ANCHOR_OVERSHOOT_EPS)"]
    expression: "h := dt / n,  n := ceil( dt / (0.5 / ω) )  【ω := ANCHOR_RESPONSE】;  重复 n 次 : ① v_anchor ← v_anchor + ( (P_player − anchor) × ω² − v_anchor × 2ω ) × h  (先更新速度) ; ② anchor ← anchor + v_anchor × h  (再以 **新** 速度更新位置)"
    notes: "**取二阶临界阻尼而非指数趋近**:指数趋近在急停 / 急转时留**拖尾残影感**,
      临界阻尼给出「跟上但不过冲」的重量感(Player Fantasy 第二条第 3 点要的手感)。
      🔴 **求值次序是承重的(2026-09-16 首轮评审 B3 订正)**:① 必须先于 ②,否则退化为
      **前向 / 显式 Euler** —— 其特征值为 `λ = 1 − ω·dt`(Jordan 块)⇒ `ω·dt → 1` 时振铃、
      `> 2` 时**发散**。半隐式对线性阻尼**无条件稳定** ⇒ **`ω` 无上界**(GDD F-2-1 边界行为 ③)。
      **子步的意义**:`n := ceil( dt / (0.5 / ω) )` 保证 `ω·h ≤ 0.5` ⇒ 即使 `dt` 尖峰,
      单步也在良态区;`n` / `h` 是**派生量**,**不可独立调**(GDD §Tuning Knobs 组 5c)。
      ⚠️ **闭式解被否**:逐帧求 `e^{−ωt}` 对手性 / 逐位判据**脆弱**(跨平台 `exp` 非逐位一致),
      而离散积分器的误差是**可控且可断言**的。
      🔴 **「无过冲」已于 2026-09-16 撤回**:任何**离散**积分器都有非零过冲(临界阻尼的
      「无过冲」是**连续时间**的定义性质)。原文据此写的判据 `dot(P_player − anchor, v_anchor) ≥ 0`
      **对任何离散积分器都不可满足** ⇒ 现改为 `e_k ≥ −ANCHOR_OVERSHOOT_EPS`(`AC-2-11`),
      容差常量**归 2**;`AC-2-12` 亦由「与 `dt := MAX_DT` 逐位相同」改为**位移上界**
      (逐位相同会**反向强制**保留显式积分器)。
      🔴 **`MAX_DT` 的性质(评审 B3 之核)**:它是系统 1 的**位移预算**常量
      (`SPEED_MAX × MAX_DT ≤ LATTICE_SIZE`,归 `LATTICE_SIZE` / **6** —— F-6-1 所有权反转),**不是数值稳定门** ——
      混为一谈正是原公式的根错(钳位只掩蔽单帧尖峰,救不了 `ω` 过大)。
      ⚠️ **`MAX_DT` 必须与系统 1 同源**(同一常量,非「相等的两个常量」)——
      这是「静默失配」的防线,也是本式登记在册的全部理由。
      **瞬移豁免**:`dist(P_player, anchor) > TELEPORT_SNAP_DIST` ⇒ 锚**直接吸附**,`v_anchor := 0`,
      不做平滑追赶(否则传送后玩家看见相机横穿整张地图,EC-2-4)。
      **两端失效模式**:`ω` 过高 ⇒ 阻尼消失,相机变刚性挂载;**过低** ⇒ 急停后画面继续滑行
      (VR 侧尤其晕眩)。"
    added: 2026-09-16
    revised: "2026-09-16"   # B3:显式 Euler → 半隐式 + 子步;撤回「无过冲」判据

