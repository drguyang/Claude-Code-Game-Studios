# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns: []

# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "A system must never write to state owned by another system.
#       Use signals or method calls on the owner instead."
#     why: "Direct state writes create race conditions and break the state
#       ownership model. The owning system must be the sole writer."
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26

forbidden_patterns:
  - pattern: world_state_events_in_history_stream
    status: active
    description: "世界状态类事件(Structure* / Drop* / Craft / ResourceHarvested)必须落世界流,不得落病史流或病例流;反之病史类 / 病例类事件不得落世界流。IEventSink 三流纯函数路由(ADR-009 §二)"
    why: "落病史流 = 污染 9 的真源所有权(同 case_events_in_history_stream);落病例流 = 跨域职责混乱 + 有界性论证不适用(世界流是系统驱动,病例流是玩家驱动)"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: world_state_stream_physical_fold
    status: active
    description: "世界流不物理折叠(ADR-009 §六)。建造物折叠行不比事件小;掉落生命周期短;医馆改写史类状态折叠 = 破坏回看"
    why: "与病例流同理(ADR-008 §六):折叠省不下长期集合,只制造第二真相。7a 定期快照 = 优化非真相"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: terrain_tool_in_runtime_generation
    status: active
    description: "第三方地形工具(GAIA / MapMagic 2)不得承担运行期生成,仅作编辑期素材 / 预览(ADR-015 §六);静态世界几何走烘焙逻辑层加载 —— 2026-09-15 ADR-015 收窄自 ADR-009 §四 的「生成数学入定点域」"
    why: "运行期生成把地形内部算法(高度图 int16 量化 / splat / 散射)的跨平台不透明性引回 sim;改为烘焙加载后该风险整条消除(ADR-015 §二)"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15
    revised: "2026-09-15"

  - pattern: pickup_deterministic_replay
    status: active
    description: "拾取判定不重放(ADR-009 §七):玩家意图(45 网络层)+ 主机当下判距 + 宽容半径 ⇒ 结果(DropClaimed)确定性进流;判定过程不进模拟域"
    why: "判距吃物理位置(表现态),位置不可重放 ⇒ 重放判距 = 模拟域悄悄依赖表现态(静默污染)"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: netcode_library_in_p0
    status: active
    description: "P0 不得引入 NGO / Fusion 等 netcode 库(ADR-001 §二):P0 只实现 pipe 抽象(IReplayPipe + ReorderBuffer)本地占位,零引擎依赖;库选型推迟到 P1b 前一次 swap 评审"
    why: "五份 ADR 已把裁决空间收窄到管道语义;P0 选库 = 用过期的决策锁死未来,且 NGO/Fusion 的状态同步能力恰是本架构刻意不用的复杂度"
    adr: docs/architecture/adr-001-networking-pipe-abstraction.md
    added: 2026-09-15

  - pattern: legacy_input_manager
    status: active
    description: "禁用 Legacy Input Manager(6.3 已弃用);输入层零旧输入依赖(ADR-011 §一)"
    why: "新旧输入系统并存 = 双份输入处理 + 双倍歧义;急救直读通道与焦点导航都要求单一输入源"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: emergency_input_through_ui_stack
    status: active
    description: "急救动作小游戏的输入必须走独立直读通道(Update 直读 Input System 动作值),不得穿过 42 UI 事件栈(排队 / 焦点路由延迟吃 <50ms 预算)"
    why: "「手稳」是急救小游戏的核心;<50ms 硬预算与 UI 事件栈不相容(ADR-011 §二 / F1)"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: input_writing_sim_domain
    status: active
    description: "输入层只产出意图(InteractIntent / EmergencyIntent / FocusNavigationIntent),不得直接写模拟域;P0 本地经 IEventSink,联机经 45(ADR-011 §一)"
    why: "输入是意图源(ADR-005);输入直写模拟域 = 绕过确定性模拟 / 权威边界,联机即静默分叉"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: case_events_in_history_stream
    status: active
    description: "病例事件(立案/结案/模式识别/判断记录)必须落病例流,不得落病史流;反之处置事件(9 的求值输入)必须留在病史流。IEventSink 按 Kind 纯函数路由"
    why: "病例落病史流 ⇒ 被终态折叠删掉(ADR-005 :207)⇒ case_id 不可重构、fires-once 破坏、处置证据丢失;处置事件移走 ⇒ 9 的 F1/F4 求值失源"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: case_stream_physical_fold
    status: active
    description: "病例流不物理折叠(拒绝 Alternative 3)。未结案案例永不折叠(规则六),改写史为玩家回看需完整历史(规则四 / AC-37-05)"
    why: "折叠行塞不下变长改写史 + 未结案集合省不下来 + 需另建 fires-once 机制,收益不成立"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: salt_as_secrecy
    status: active
    description: "加盐哈希键(PatternRecognized)是防御纵深,不是保密层。规则九保密 = 呈现层 DTO 静态检查(AC-37-15);P0 ≤ 8 病种枚举空间必然可逆"
    why: "把盐当保密体 = 给「disease_id 不会泄漏」的假保证,而病史流明文 onset 已含病种、客户端持流副本"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: qemu_for_bitwise_verification
    status: active
    description: "禁止用 qemu 模拟的 ARM64 IL2CPP 作为逐位判据(ADR-012 §二)。qemu-user 下 ARM64 走 softfloat,浮点/回绕语义与真实硬件不同;仅可作冒烟测试"
    why: "黄金对拍的判据价值高于便利;qemu 下的「逐位相同」是假的,会掩盖真实漂移"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: golden_fixture_single_platform_resign
    status: active
    description: "禁止单平台独签黄金夹具(ADR-012 §四)。刷新必须新版本目录(golden-vN)+ 变更日志 + 全体平台同时重签;旧版保留作回归对比"
    why: "单平台独签 = 把该平台的漂移冻结成「正确值」,其余平台反而报错;版本化刷新让漂移有审计轨迹"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: il2cpp_flags_global_singleton
    status: active
    description: "禁止把 IL2CPP 编译旗标当作全局单值登记(ADR-012 §三)。SetAdditionalIl2CppArgs 是全局单值,逐目标登记须 IPreprocessBuildWithReport 按 BuildTarget 切换 + per-target 登记表(PR 审查)"
    why: "全局单值直存 = 各目标平台共用一套旗标,ARM64 / x64 的 FMA 差异无法分别登记,构建行为不可复现"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: ui_holding_game_state
    status: active
    description: "42 拟物 UI 只渲染,永不持有游戏状态(systems-index §9 C3 / ADR-013 §三)。「体征 → 呈现形态」映射表归 8 诊断;UI 只读 DTO(`IVitalsQuery → VitalsDto`),零模拟写"
    why: "UI 持状态 = 第二真相,与事件流唯一真源冲突;映射表属医学知识,不属渲染知识"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: dual_eventsystem
    status: active
    description: "禁止 UI Toolkit 与 UGUI 各挂一个 EventSystem / 并存 StandaloneInputModule 与 InputSystemUIInputModule(ADR-013 §一 / F4)。两栈共用同一 EventSystem;焦点单栈门保证同一时刻仅一栈接收导航意图流"
    why: "双 EventSystem / 双输入模块 = 输入事件被两套栈各处理一次,焦点乱跳;焦点流双喂 = 同键两次焦点移动"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: focus_navigation_reimplementation
    status: active
    description: "禁止自实现 UI 焦点移动算法(ADR-013 §五)。用官方桥(`NavigationMoveEvent`)后焦点移动由 UI Toolkit FocusController 引擎自动完成;若某控件同时绑 Input System 默认 `UI` action map 的 `Navigate` 与自建焦点动作 = 同键双触发"
    why: "重复实现 = 双触发根源;官方桥已覆盖手柄焦点移动,自建是过度工程且与 ADR-011 裁定冲突"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: runtime_json_deserialization
    status: active
    description: "禁止在玩家构建内运行 JSON 解析器(ADR-014 §二/§三)。JSON 是作者态;出货的是构建期烘焙产物(*.cooked),Fix 字段已落盘为 raw long。违者把解析器逐平台逐位性重新引入运行期确定性面"
    why: "解析器进玩家构建 ⇒ R-8 从结构性规避退化为须实测;运行期解析失败要硬失败而非静默,风险面更大"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: json_object_deserialization_for_fix_data
    status: active
    description: "禁止用 JsonConvert.DeserializeObject<T> / JObject.Parse 等对象反序列化 API 读入承载 Fix 的数据(ADR-014 §三 阶段1)。它们把 JSON 数字经 double/decimal 中转填入对象,是绕过 FixParse 的静默浮点泄漏通道;Newtonsoft 仅可作词法器(JsonTextReader)"
    why: "ADR-006 存在的理由即「拒浮点、唯一入口」;对象反序列化让浮点在 FixParse 之外进入内存,且失败静默"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: fix_field_as_json_number
    status: active
    description: "禁止把承载 Fix 的字段写成 JSON 数字(ADR-014 §四)。必须是 JSON 字符串(如 \"offset\": \"3/4\"),词法器交出 String token,浮点从不进入内存。JSON 数字 token 会被词法器自解析为 long/double/decimal"
    why: "数字一旦被词法器转成 CLR 基元,浮点即已在内存 —— 「拒浮点」由结构性保证退化为行为约束"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: cooked_artifact_source_drift
    status: active
    description: "禁止提交与源 JSON 不一致的烘焙产物(ADR-014 §Validation 陈旧门)。CI 对提交的源重烘,断言产物逐字节一致,否则构建失败。改数值须同步重烘"
    why: "源改了没重烘 ⇒ 运行期用旧值,静默漂移;陈旧门让它成为构建失败而非运行期幻觉"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: chunk_local_coordinate_system
    status: active
    description: "禁止引入 chunk 局部坐标系(ADR-015 §四)。chunk 只是加载 / 卸载 / 失效的粒度,一个 chunk 覆盖固定格矩形;WorldPos 永远是全局世界格坐标,chunk 只暴露「包含哪些格」不暴露坐标"
    why: "chunk 自带原点 ⇒ 同一点在两块有两种坐标,跨 chunk 判定必错;对齐 / 接缝是经典静默 bug 源,全局单格代数上更简单"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15

  - pattern: visual_terrain_sampling_into_sim
    status: active
    description: "禁止把视觉层地形采样喂进 sim(ADR-015 §一)。如用 Terrain.SampleHeight / NavMesh 采样决定可走性、或从 Vector3 视觉坐标反推逻辑格 —— 那是 float 入 sim,破 ADR-006;可走性一律由逻辑导航格给出"
    why: "视觉层是 float 任意、Terrain 内部算法跨平台不保证逐位;采样入 sim 把 R-9 好不容易排除的风险引回,且破 ADR-006 的禁 float 边界"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15
