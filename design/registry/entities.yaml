      ⚠️ **未决**:当前 `cell` 是**单格**;若某 POI(如一座大院)需占多格,本 schema 须扩
      (6 的 `OQ-6-4` —— 若扩,须回改 ADR-021 §① 的载荷描述)。"
    added: 2026-09-16
    revised: ""

