name: Lint and Guard Checks

# 2026-09-29: Unity 测试 job 已移除（UNITY_LICENSE 不配置）。
# Unity 测试改由桌面手动执行（EditMode 921 passed / 0 failed，2026-09-29）。
# 本 workflow 仅保留构建期守卫断言（纯 bash，不依赖 Unity 工程）。
#
# 如需恢复 Unity CI，需：
#   1. 配置 UNITY_LICENSE / UNITY_EMAIL / UNITY_PASSWORD GitHub secrets
#   2. 工程根 unity/ 下存在可编译的 Unity 工程
#   3. 恢复 tests.yml 的 Unity job 配置（git 历史可查）

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  guard-assertions:
    name: "Architecture guards (PresentationDtoGuard / 门A 引用白名单 / 音频触发白名单)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run guard tests
        run: |
          echo "TODO(实现轮):调用 tests/golden 的哈希比对入口。"
          echo "守卫未实现前此步须保持未接入 —— 接入即红是设计意图(禁假绿)。"
          exit 0   # ⚠️ 占位通过;守卫未实现前不记绿

  # 2026-10-15 立:kindgen(= AC-37-03 的唯一载体)。
  # 背景:补评原件 production/qa/evidence/review-case-system-story-001-retro-2026-10-15.md
  #   §二 B-4 —— 「测试从不运行 kindgen;把 kindgen 删掉,13 条测试照样全绿」;
  #   生成物自述(StreamRouting.g.cs 头注「产物存在即断言已过」)**不是证据**。
  #   ⇒ 断言执行权移到这里:本 job 失败即 CI 红,AC-37-03 无第二载体。
  # 独立成 job(不并入 guard-assertions):后者是占位 TODO,本 job 是**真跑的绿**。
  # 纯 Python + PyYAML,零 Unity 依赖 —— 与工作流既有取向一致。
  kindgen-assertions:
    name: "Kind registry assertions (kindgen A1–A5)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet "PyYAML==6.0.3"   # 与本地验证版本一致(实测 kindgen 通过)

      - name: kindgen assertions (A1–A5, --check 不写文件)
        run: python3 tools/kindgen/kindgen.py --check

      - name: Generated artifact matches registry (重生成后再生成一致性)
        run: |
          python3 tools/kindgen/kindgen.py
          if ! git diff --quiet -- unity/Assets/Sim/StreamRouting.g.cs; then
            echo "::error::StreamRouting.g.cs 与 registry 脱钩 —— 重跑 kindgen 并提交产物"
            git diff -- unity/Assets/Sim/StreamRouting.g.cs
            exit 1
          fi
          echo "StreamRouting.g.cs 与 registry 一致(逐字节)"

  # 2026-10-15 立:kindgen 变异探针(= A2 / A2b **判别力**的常驻执行体)。
  # 背景:fix-s11-12 §四 的 7 变异矩阵当时是 /tmp 沙箱**一次性**实测;
  #   补评原件 review-case-system-story-001-postfix §六-5 如实登记:
  #     「【变异矩阵无常驻执行体】§四 的 7 变异是沙箱一次性实测,**未固化为 CI 步骤**」
  #   ⇒ 其证据力 = 一次性实测,非持续判据。本 job 把该矩阵固化为持续判据:
  #   任一变异**未被捕获**(断言逃逸)= 判别力缺口 ⇒ CI 红。
  # 与 kindgen-assertions 的分工:那个 job 证「断言**跑得过**」,本 job 证「断言**抓得住**」。
  # 零文件写入(变异施加在内存副本上)+ 零 Unity 依赖 —— 与工作流既有取向一致。
  kindgen-mutation-probe:
    name: "Kind registry mutation probe (A2/A2b 判别力)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python3 -m pip install --quiet "PyYAML==6.0.3"

      - name: Mutation probe (7 变异,全部须被捕获)
        run: python3 tools/kindgen/mutation_probe.py

