  - name: PoiState
    status: active
    source: design/gdd/world-and-ecozones.md
    referenced_by:
      - design/gdd/world-and-ecozones.md   # 6:R-6-7 + States 的转移全表(T1–T4)+ AC-6-10…16 + OQ-6-7
      - docs/architecture/adr-021-poi-state-ownership.md   # §③ 载荷 `{ poi_id, new_state }`(枚举值刻意归 6)
      - docs/architecture/adr-009-world-state-event-boundary.md   # §六 有界性(枚举基数是其输入)
      - docs/registry/architecture.yaml   # states.poi_state(所有权侧,与本条目成对)
      - design/registry/entities.yaml   # formulas.poi_transition_bound(本枚举基数是其系数来源)
    values: ["Undiscovered = 0", "Discovered = 1", "Resolved = 2"]
    unit: "i32 枚举（整数，ADR-006 边界）"
    constraint: "**单调不可逆** —— 严格递增 `Undiscovered → Discovered → Resolved`;
      **无「已锁」/「已荒废」**（2026-09-16 用户裁定:三态最小集）。
      合法转移**只有 4 条平表条目**（T1 `0→1` / T2 `1→2` / T3 `0→2` 跳级 / T4 降级 = **非法**）。
      **`Patient = PatientId.None`**（世界级事件哨兵，ADR-007 §四，不污染 `max(patient_id)` 高水位）；
      **主机唯一 `Append`**（ADR-005 / ADR-020 Amendment B 同型纪律）。"
    notes: "**为什么三态就够**:① `Undiscovered` = 加载期默认;② `Discovered` = 玩家到过 / 感知过;
      ③ `Resolved` = 该 POI 的「事」了结了。**`Resolved` 是终态,无退出**。
      ⚠️ **「已锁」被刻意排除** —— 生态区级别的封锁是**生态区属性**,不属于单个 POI 的状态
      (6 的 R-6-8);若混进本枚举,会把「生态区推进门槛」这个归 #32 的裁决**偷偷搬进 6**。
      ⚠️ **`Discovered` 与 `Resolved` 之间可以跳级**（`0→2`,T3）—— 单调性只约束**不回退**。
      🔴 **非法转移的处置是三条不同的规则,不可合并**:① **同态重入 ⇒ 幂等静默丢弃,不 Append**
      （必须是 6 的职责而非上游的 —— 重复 Append 会击穿 `poi_transition_bound` 的有界性前提）;
      ② **降级 ⇒ 不 Append + 开发期告警**（**不得静默接受** —— 它是上游判定的 bug 信号或乱序）;
      ③ **未登记 `poi_id` ⇒ 不 Append + 报错**（架构级失败:越权写者 / id 错配）。
      ⚠️ **未决 `OQ-6-7`**:单调性是否最终定为**全局不变量**。若 P1a 引入「已荒废 / 已收复」
      类**回退**语义,则本条与 `poi_transition_bound`、`AC-6-15` **同时作废**,
      且 ADR-009 §六 的有界性论证须重做 ⇒ **若判负须另开 ADR**,不得在 6 的 GDD 内打补丁。"
    added: 2026-09-16
    revised: ""

