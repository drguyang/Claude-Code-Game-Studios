    adr: docs/architecture/adr-020-player-controller-and-camera.md
    reason: "本作 P0 玩家移动不与物理世界耦合(建造走整数格邻接,ADR-015 §五)—— kinematic 刚体的物理交互价值用不上却换来更难调的手感与更多非确定性面。Cinemachine 3.0 是 post-cutoff 大重写(知识风险),且 DOTS 同属官方包亦已被 ADR-017 结构性排除 ⇒『官方包』不是零第三方纪律的豁免"
    referenced_by:
      - docs/architecture/adr-020-player-controller-and-camera.md
      - docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
      - docs/architecture/adr-011-input-architecture.md
      - .claude/docs/technical-preferences.md   # 候选未采纳:Cinemachine
    added: 2026-09-15
    revised: ""

  - purpose: camera_rig_and_viewpoint
    status: active
    api: "自建相机机位 ICameraRig(Explore / Treatment / Casebook / VR FirstPerson);平面 = 第三人称越肩,VR = 独立第一人称(头显);镜头效果归属 = 8 语义 + 2 实现"
    not: "Cinemachine 虚拟相机栈;VR 模式禁用镜头效果(舒适度优先,承 diagnosis-system.md:1519);用镜头效果**报**状态(与 ADR-018 §六 无提示音铁律同源,是同一铁律的视觉侧)"
    adr: docs/architecture/adr-020-player-controller-and-camera.md
    reason: "平面越肩承 game-concept.md:32『全程第三人称』(旧稿第一人称已被用户推翻,不复活);VR 第一人称是头显物理事实,与平面路径独立(消解表面矛盾)。零第三方第七处一致性 ⇒ 自建"
    referenced_by:
      - docs/architecture/adr-020-player-controller-and-camera.md
      - docs/architecture/adr-018-audio-architecture.md
      - design/gdd/diagnosis-system.md   # :1519 VR 禁效果 / :1641 镜头效果归属
      - design/gdd/game-concept.md   # :32
    added: 2026-09-15
    revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).


# Example:
#
# forbidden_patterns:
#   - pattern: autoload_singleton_coupling
#     status: active
#     description: "Systems must not directly reference Autoload singletons by name.
#       Use dependency injection or signals instead."
#     why: "Tight coupling to Autoloads makes systems untestable in isolation and
#       creates hidden dependencies that break when Autoload load order changes."
#     adr: docs/architecture/adr-0001-health-system.md
#     added: 2026-03-26
#
#   - pattern: direct_cross_system_state_write
#     status: active
#     description: "A system must never write to state owned by another system.
#       Use signals or method calls on the owner instead."
#     why: "Direct state writes create race conditions and break the state
#       ownership model. The owning system must be the sole writer."
#     adr: docs/architecture/adr-0000-architecture-principles.md
#     added: 2026-03-26

forbidden_patterns:
  - pattern: world_state_events_in_history_stream
    status: active
    description: "世界状态类事件(Structure* / Drop* / Craft / ResourceHarvested / PoiStateChanged / ActorCellEntered / EncounterStarted / EncounterEnded)必须落世界流,不得落病史流或病例流;反之病史类 / 病例类事件不得落世界流。IEventSink 三流纯函数路由(ADR-009 §二 · §三 · ADR-021)"
    why: "落病史流 = 污染 9 的真源所有权(同 case_events_in_history_stream);落病例流 = 跨域职责混乱 + 有界性论证不适用(世界流是系统驱动,病例流是玩家驱动)"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: world_state_stream_physical_fold
    status: active
    description: "世界流不物理折叠(ADR-009 §六)。建造物折叠行不比事件小;掉落生命周期短;医馆改写史类状态折叠 = 破坏回看"
    why: "与病例流同理(ADR-008 §六):折叠省不下长期集合,只制造第二真相。7a 定期快照 = 优化非真相"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: terrain_tool_in_runtime_generation
    status: active
    description: "第三方地形工具(GAIA / MapMagic 2)不得承担运行期生成,仅作编辑期素材 / 预览(ADR-015 §六);静态世界几何走烘焙逻辑层加载 —— 2026-09-15 ADR-015 收窄自 ADR-009 §四 的「生成数学入定点域」"
    why: "运行期生成把地形内部算法(高度图 int16 量化 / splat / 散射)的跨平台不透明性引回 sim;改为烘焙加载后该风险整条消除(ADR-015 §二)"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15
    revised: "2026-09-15"

  - pattern: pickup_deterministic_replay
    status: active
    description: "拾取判定不重放(ADR-009 §七):玩家意图(45 网络层)+ 主机当下判距 + 宽容半径 ⇒ 结果(DropClaimed)确定性进流;判定过程不进模拟域"
    why: "判距吃物理位置(表现态),位置不可重放 ⇒ 重放判距 = 模拟域悄悄依赖表现态(静默污染)"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    added: 2026-09-15

  - pattern: netcode_library_in_p0
    status: active
    description: "P0 不得引入 NGO / Fusion 等 netcode 库(ADR-001 §二):P0 只实现 pipe 抽象(IReplayPipe + ReorderBuffer)本地占位,零引擎依赖;库选型推迟到 P1b 前一次 swap 评审"
    why: "五份 ADR 已把裁决空间收窄到管道语义;P0 选库 = 用过期的决策锁死未来,且 NGO/Fusion 的状态同步能力恰是本架构刻意不用的复杂度"
    adr: docs/architecture/adr-001-networking-pipe-abstraction.md
    added: 2026-09-15

  - pattern: legacy_input_manager
    status: active
    description: "禁用 Legacy Input Manager(6.3 已弃用);输入层零旧输入依赖(ADR-011 §一)"
    why: "新旧输入系统并存 = 双份输入处理 + 双倍歧义;急救直读通道与焦点导航都要求单一输入源"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: emergency_input_through_ui_stack
    status: active
    description: "急救动作小游戏的输入必须走独立直读通道(Update 直读 Input System 动作值),不得穿过 42 UI 事件栈(排队 / 焦点路由延迟吃 <50ms 预算)"
    why: "「手稳」是急救小游戏的核心;<50ms 硬预算与 UI 事件栈不相容(ADR-011 §二 / F1)"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: input_writing_sim_domain
    status: active
    description: "输入层只产出意图(InteractIntent / EmergencyIntent / FocusNavigationIntent),不得直接写模拟域;P0 本地经 IEventSink,联机经 45(ADR-011 §一)"
    why: "输入是意图源(ADR-005);输入直写模拟域 = 绕过确定性模拟 / 权威边界,联机即静默分叉"
    adr: docs/architecture/adr-011-input-architecture.md
    added: 2026-09-15

  - pattern: case_events_in_history_stream
    status: active
    description: "病例事件(立案/结案/模式识别/判断记录)必须落病例流,不得落病史流;反之处置事件(9 的求值输入)必须留在病史流。IEventSink 按 Kind 纯函数路由"
    why: "病例落病史流 ⇒ 被终态折叠删掉(ADR-005 :207)⇒ case_id 不可重构、fires-once 破坏、处置证据丢失;处置事件移走 ⇒ 9 的 F1/F4 求值失源"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: case_stream_physical_fold
    status: active
    description: "病例流不物理折叠(拒绝 Alternative 3)。未结案案例永不折叠(规则六),改写史为玩家回看需完整历史(规则四 / AC-37-05)"
    why: "折叠行塞不下变长改写史 + 未结案集合省不下来 + 需另建 fires-once 机制,收益不成立"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: salt_as_secrecy
    status: active
    description: "加盐哈希键(PatternRecognized)是防御纵深,不是保密层。规则九保密 = 呈现层 DTO 静态检查(AC-37-15);P0 ≤ 8 病种枚举空间必然可逆"
    why: "把盐当保密体 = 给「disease_id 不会泄漏」的假保证,而病史流明文 onset 已含病种、客户端持流副本"
    adr: docs/architecture/adr-008-case-event-stream.md
    added: 2026-09-15

  - pattern: qemu_for_bitwise_verification
    status: active
    description: "禁止用 qemu 模拟的 ARM64 IL2CPP 作为逐位判据(ADR-012 §二)。qemu-user 下 ARM64 走 softfloat,浮点/回绕语义与真实硬件不同;仅可作冒烟测试"
    why: "黄金对拍的判据价值高于便利;qemu 下的「逐位相同」是假的,会掩盖真实漂移"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: golden_fixture_single_platform_resign
    status: active
    description: "禁止单平台独签黄金夹具(ADR-012 §四)。刷新必须新版本目录(golden-vN)+ 变更日志 + 全体平台同时重签;旧版保留作回归对比"
    why: "单平台独签 = 把该平台的漂移冻结成「正确值」,其余平台反而报错;版本化刷新让漂移有审计轨迹"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: il2cpp_flags_global_singleton
    status: active
    description: "禁止把 IL2CPP 编译旗标当作全局单值登记(ADR-012 §三)。SetAdditionalIl2CppArgs 是全局单值,逐目标登记须 IPreprocessBuildWithReport 按 BuildTarget 切换 + per-target 登记表(PR 审查)"
    why: "全局单值直存 = 各目标平台共用一套旗标,ARM64 / x64 的 FMA 差异无法分别登记,构建行为不可复现"
    adr: docs/architecture/adr-012-cross-platform-determinism-ci-gate.md
    added: 2026-09-15

  - pattern: ui_holding_game_state
    status: active
    description: "42 拟物 UI 只渲染,永不持有游戏状态(systems-index §9 C3 / ADR-013 §三)。「体征 → 呈现形态」映射表归 8 诊断;UI 只读 DTO(`IVitalsQuery → VitalsDto`),零模拟写"
    why: "UI 持状态 = 第二真相,与事件流唯一真源冲突;映射表属医学知识,不属渲染知识"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: dual_eventsystem
    status: active
    description: "禁止 UI Toolkit 与 UGUI 各挂一个 EventSystem / 并存 StandaloneInputModule 与 InputSystemUIInputModule(ADR-013 §一 / F4)。两栈共用同一 EventSystem;焦点单栈门保证同一时刻仅一栈接收导航意图流"
    why: "双 EventSystem / 双输入模块 = 输入事件被两套栈各处理一次,焦点乱跳;焦点流双喂 = 同键两次焦点移动"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: focus_navigation_reimplementation
    status: active
    description: "禁止自实现 UI 焦点移动算法(ADR-013 §五)。用官方桥(`NavigationMoveEvent`)后焦点移动由 UI Toolkit FocusController 引擎自动完成;若某控件同时绑 Input System 默认 `UI` action map 的 `Navigate` 与自建焦点动作 = 同键双触发"
    why: "重复实现 = 双触发根源;官方桥已覆盖手柄焦点移动,自建是过度工程且与 ADR-011 裁定冲突"
    adr: docs/architecture/adr-013-skeuomorphic-ui-framework.md
    added: 2026-09-15

  - pattern: runtime_json_deserialization
    status: active
    description: "禁止在玩家构建内运行 JSON 解析器(ADR-014 §二/§三)。JSON 是作者态;出货的是构建期烘焙产物(*.cooked),Fix 字段已落盘为 raw long。违者把解析器逐平台逐位性重新引入运行期确定性面"
    why: "解析器进玩家构建 ⇒ R-8 从结构性规避退化为须实测;运行期解析失败要硬失败而非静默,风险面更大"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: json_object_deserialization_for_fix_data
    status: active
    description: "禁止用 JsonConvert.DeserializeObject<T> / JObject.Parse 等对象反序列化 API 读入承载 Fix 的数据(ADR-014 §三 阶段1)。它们把 JSON 数字经 double/decimal 中转填入对象,是绕过 FixParse 的静默浮点泄漏通道;Newtonsoft 仅可作词法器(JsonTextReader)"
    why: "ADR-006 存在的理由即「拒浮点、唯一入口」;对象反序列化让浮点在 FixParse 之外进入内存,且失败静默"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: fix_field_as_json_number
    status: active
    description: "禁止把承载 Fix 的字段写成 JSON 数字(ADR-014 §四)。必须是 JSON 字符串(如 \"offset\": \"3/4\"),词法器交出 String token,浮点从不进入内存。JSON 数字 token 会被词法器自解析为 long/double/decimal"
    why: "数字一旦被词法器转成 CLR 基元,浮点即已在内存 —— 「拒浮点」由结构性保证退化为行为约束"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: cooked_artifact_source_drift
    status: active
    description: "禁止提交与源 JSON 不一致的烘焙产物(ADR-014 §Validation 陈旧门)。CI 对提交的源重烘,断言产物逐字节一致,否则构建失败。改数值须同步重烘"
    why: "源改了没重烘 ⇒ 运行期用旧值,静默漂移;陈旧门让它成为构建失败而非运行期幻觉"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-15

  - pattern: ordinal_renumbering
    status: active
    description: "禁止重编号或重定义既有 ordinal 映射条目(ADR-014 §五 D-21-13 承接条 ③)。覆盖集语料的枚举 ordinal 只可**追加**,既有条目的号永不重用、永不改义;构建期对 `assets/data/_ordinal_baseline.json` 基线快照断言,任何改动 = **构建期硬失败**"
    why: "**静默错读**类缺陷:改号后旧存档里存的是旧号,读出来变成另一个病种(「麻黄汤读成桂枝汤」)—— 能正常加载、逐位可回放、**无任何报错**。ConfigVersion 只保证「改动可追溯」,不保证「读得对」;**两者缺一不可,不能互相替代**。仓库既有先例:`docs/CLAUDE.md` TR Registry 规则「Never renumber existing IDs — only append new ones」(本门把它从人工约定升为构建失败)"
    adr: docs/architecture/adr-014-data-pipeline-and-json-parser.md
    added: 2026-09-17

  - pattern: chunk_local_coordinate_system
    status: active
    description: "禁止引入 chunk 局部坐标系(ADR-015 §四)。chunk 只是加载 / 卸载 / 失效的粒度,一个 chunk 覆盖固定格矩形;WorldPos 永远是全局世界格坐标,chunk 只暴露「包含哪些格」不暴露坐标"
    why: "chunk 自带原点 ⇒ 同一点在两块有两种坐标,跨 chunk 判定必错;对齐 / 接缝是经典静默 bug 源,全局单格代数上更简单"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15

  - pattern: visual_terrain_sampling_into_sim
    status: active
    description: "禁止把视觉层地形采样喂进 sim(ADR-015 §一)。如用 Terrain.SampleHeight / NavMesh 采样决定可走性、或从 Vector3 视觉坐标反推逻辑格 —— 那是 float 入 sim,破 ADR-006;**sim 侧**可走性一律由逻辑导航格给出(⚠️ **2026-09-16 作用域补注**:玩家侧可走性 = `CharacterController` 的 collide-and-slide,不走此条 —— 见 `player-controller-and-movement.md` R3)"
    why: "视觉层是 float 任意、Terrain 内部算法跨平台不保证逐位;采样入 sim 把 R-9 好不容易排除的风险引回,且破 ADR-006 的禁 float 边界"
    adr: docs/architecture/adr-015-world-geometry-fixed-world-lattice.md
    added: 2026-09-15

  - pattern: ai_reads_presentation_position
    status: active
    description: "禁止 AI 决策读表现态位置(ADR-016 §一/§三)。玩家位置的表现态通道走 ADR-001 第二 QoS(unreliable latest-value),到达时序不确定;决策必须读 sim 侧的粗粒度整数格事实(玩家跨格写世界流事件)。禁 Transform.position / Vector3 进决策输入,禁从表现层位姿反推逻辑格"
    why: "决策读时序不确定的输入 ⇒ 不再是 tick 上的确定性函数 ⇒ 主机/客户端敌人行为分叉且无法察觉,直接推翻 ADR-016 §一 的『决策可重建』不变量。这是最诱人的捷径,必须在门 A/B 与 grep 上同时守"
    adr: docs/architecture/adr-016-ai-architecture.md
    added: 2026-09-15

  - pattern: runtime_behavior_tree_library
    status: active
    description: "禁止在玩家构建内引入运行期第三方行为树/寻路库(ADR-016 §四/§五)。行为程序在作者期以数据表表达(P0 = 手写 JSON),构建期烘为整数数据(走 ADR-014 管线),运行期是自研整数决策器;寻路在 sim 侧走烘焙整数导航格"
    why: "第三方行为树时序不保证逐位、难进 sim 整数域,且与运行期零第三方的纪律相悖(同 ADR-014 的零解析器、ADR-015 的零第三方几何工具)"
    adr: docs/architecture/adr-016-ai-architecture.md
    added: 2026-09-15

  - pattern: ai_freeze_uses_presentation_state
    status: active
    description: "禁止用表现态量作 AI 决策节流 / 冻结的判据(ADR-016 §九,2026-09-17 就地修订)。冻结判据恰 = {in_combat, d2, 速度, Tick, last_decision_tick} —— **禁『离屏 / 相机可见性』· 禁 Time.deltaTime · 禁帧号**。『离屏』是相机事实(表现态),主机与客户端对它的判定不同 ⇒ 一边冻结一边推进,且分叉静默(GDD:`enemy-ai.md` F-27-3 / AC-27-04 的反射白名单守住)"
    why: "冻结是 step 跳过 ⇒ 它改变位姿(LogiPose / acc / path_cursor 是积分量,不是 tick 的纯函数)。用表现态判定『谁被冻结』= 用不可重建的第四来源决定 sim 推进,直接破 ADR-016 §一 的重建三源不变量。原 §九 写『离屏 / 远区可冻结』与『冻结不改变判定』两句均已就地修订"
    adr: docs/architecture/adr-016-ai-architecture.md
    added: 2026-09-17

  - pattern: enemy_injury_into_history_stream
    status: active
    description: "禁止把敌人伤情/昏迷事件落病史流(ADR-016 §二)。敌人是世界实体,其伤情状态变化落世界流(第三条流);病史流是病人的唯一真源,不得被敌人状态污染。折叠谓词不适用于敌人行"
    why: "落病史流 = 污染 9 的真源所有权(同 case_events_in_history_stream / world_state_events_in_history_stream);且病史流的折叠规则针对病人,敌人行套用会产生错误折叠"
    adr: docs/architecture/adr-016-ai-architecture.md
    added: 2026-09-15

  - pattern: dots_in_sim_assembly
    status: active
    description: "禁止在 sim 程序集引入 DOTS 栈的任一程序集(ADR-017 §一/§二)。Unity.Entities / Unity.Burst / Unity.Jobs / Unity.Mathematics 全是引擎程序集,撞门 A(`noEngineReferences: true`)。**局部引入(如只给一个热点函数加 [BurstCompile])同样违规** —— 门 A 不看规模,只看引用集"
    why: "门 A 是 ADR-005 确定性结构面的全部依据;上 DOTS 即须拆门 A,拆门 A 即放弃『sim 零引擎依赖』的结构性保证 —— 这是二选一不是权衡。此接缝在 ADR-017 之前全文无记载,是最容易被误解的一点"
    adr: docs/architecture/adr-017-dots-decision.md
    added: 2026-09-15

  - pattern: dots_into_presentation_without_trigger
    status: active
    description: "禁止在 DOTS 复评门触发前于表现层引入 DOTS(ADR-017 §三)。触发 = OQ-8 标定完成 + 同场实体数 / 表现层帧占比 ≥ [阈值待用户裁定];触发后须**另开 ADR**,不得以 ADR-017 的修订直接改判"
    why: "无触发条件下引入一套改变构建流程 / 调试方式 / 学习曲线的栈,是 P0 窗口(6–9 个月基线已钉死)的范围债;且规模数据不存在 ⇒ 无法论证收益。与四连的『零多余栈』取向相悖"
    adr: docs/architecture/adr-017-dots-decision.md
    added: 2026-09-15

  - pattern: audio_cue_state_broadcast
    status: active
    description: "禁止用音频**播报**状态变化(ADR-018 §六,无提示音铁律的机械化)。黑名单:sting / jingle / 提示音宣告状态变化(转危 / 误诊 / 结案 / 成就)· 用 ducking 报状态 · 用素材切换报状态 · 用音频表达本该由玩家读数得出的结论。白名单 = 行为反馈(玩家动作 / 主动检查 / 可感知世界声 / 呼吸的连续变化)。**AC-44-09 BLOCKING**"
    why: "加一句 PlayOneShot(ding) 就能破坏支柱一『判断为骨』(disease-simulation.md:1120-1121 明写『比数值错误严重得多』),而这是**听不出是 bug** 的那一类 —— BLOCKING 级铁律必须有构建门,不能只有 prose"
    adr: docs/architecture/adr-018-audio-architecture.md
    added: 2026-09-15

  - pattern: audio_reads_sim_state
    status: active
    description: "禁止 44 直接读 sim 真值(ADR-018 §一)。44 只接收上游表现层发出的语义 cue(AudioCueDto);语义解析(如按病种选素材)在上游完成(8 的通道 × 档位表 / 13 的映射)。禁 44 直查 IVitalsQuery 自行决定播什么音"
    why: "44 直读会持有游戏状态(违 ADR-013 §9 C3 的 42 同构纪律);且选素材需读 disease_id ⇒ 直接撞 AC-37-15 的呈现层泄漏门"
    adr: docs/architecture/adr-018-audio-architecture.md
    added: 2026-09-15

  - pattern: telemetry_outbound_transmission
    status: active
    description: "禁止任何出厂数据(ADR-019 §二)。构建产物与运行期不得有网络上报调用(HttpClient / UnityWebRequest / 第三方 SDK);ITelemetrySink 不得有 Upload / Send / Post。崩溃上报同样不引入(若日后需要,须先解决隐私面并另开 ADR)。**AC-19-02 BLOCKING**"
    why: "PC/Steam 单机 + P2P 本无任何出厂数据 ⇒ 隐私面结构性干净(无同意机制 / 无导出删除 / 无退出开关);引入出厂即使只是 opt-in 也让 ADR-019 §四 失效,必须另开 ADR 而非打补丁。且引擎参考对 Unity Analytics / UGS 零覆盖,本机亦无法联网核查第三方条款"
    adr: docs/architecture/adr-019-telemetry-and-privacy.md
    added: 2026-09-15

  - pattern: telemetry_write_channel
    status: active
    description: "禁止 51 写三流(ADR-019 §三)。51 是**只读消费者**,不得成为第四个 IEventSink 写入者,不得进 sim 程序集。若某指标无法从事件流得出,处置是**先问该状态是否本就该进流**(ADR-009 三问判据),而不是给 51 加旁路采集"
    why: "51 能写流 ⇒ 遥测污染模拟真源,是最危险的一类越界(与 salt_as_secrecy 同类:把非真源的东西放进真源);旁路采集会造出『事件流之外的第二个真源』"
    adr: docs/architecture/adr-019-telemetry-and-privacy.md
    added: 2026-09-15

  - pattern: telemetry_writes_back_balance
    status: active
    description: "禁止 51 写回 assets/data/*.json 或输出『建议把 X 改成 Y』式的自动调参(ADR-019 §六)。51 交付**数据 + 可操作的观察结论**,不交付调好的数值。**AC-19-07**"
    why: "数值由用户手调是一贯纪律(feedback-user-owns-balance-values);调参是设计判断(需对照医学语义与手感),不是统计量的函数。51 最多让旋钮的方向更可见,不能替它转"
    adr: docs/architecture/adr-019-telemetry-and-privacy.md
    added: 2026-09-15

  - pattern: player_continuous_position_into_stream
    status: active
    description: "禁止把玩家的连续位置 / 速度 / 朝向写进三流(ADR-020 §四)。玩家位移是**表现态**;跨格瞬间发一条世界流事件(ActorCellEntered)是它在 sim 中的唯一投影。**AC-20-03 / AC-1-02 BLOCKING**:判据 = **反射断言** `ActorCellEntered` 字段类型集合 ⊆ {int32, int64, 整数枚举} —— ⚠️ **2026-09-16 订正**原写「grep 断言无『Vector3 / Transform 位置 → IEventSink.Append』路径」是**假阳性机器**(跨格检测必须读 `Vector3` 才能算 `FloorToInt(p / LATTICE_SIZE)`),会误杀正确实现"
    why: "写连续位置 = 帧率相关事件率(与 ADR-009 世界流有界性论证直接冲突),且表现态位置是第二 QoS 通道(时序不确定)—— 落进真源即污染可重建性。这是 ADR-016 §三 的对称侧:AI 读粗粒度格(禁读表现态),玩家就只写粗粒度格(禁写表现态)"
    adr: docs/architecture/adr-020-player-controller-and-camera.md
    added: 2026-09-15

  - pattern: player_movement_on_rigidbody
    status: active
    description: "禁止用 Rigidbody(动态或 kinematic + ForceMode)驱动玩家移动(ADR-020 §一)。玩家 = CharacterController(kinematic,不参与 PhysX 求解);**可走性 = CharacterController 的 collide-and-slide**(禁**事先探测**式物理查询);整数导航格**不服务玩家**(它服务 13 / 27 AI 的 sim 侧寻路,ADR-016 §四)"
    why: "本作 P0 玩家移动不与物理世界耦合(建造走整数格邻接,ADR-015 §五),Rigidbody 的物理交互价值用不上,却引入更难调的手感与更多非确定性面;物理查询决定可走性会把表现层 float 几何引回判定。⚠️ **2026-09-16 订正**(系统 1 的 GDD 落盘 · R3):原写「可走性一律由 ADR-015 整数导航格给出」**易被读成玩家也查格** —— 实际玩家走 collide-and-slide(几何直接给结果,不做可行性预判),导航格只服务 AI。判据见 AC-1-01 三条并列(含 `Physics.Raycast` / `CheckCapsule` / `Overlap*` 零引用,断言面含 prefab / 场景资产的组件清单)"
    adr: docs/architecture/adr-020-player-controller-and-camera.md
    added: 2026-09-15

  - pattern: cinemachine_in_runtime
    status: active
    description: "禁止在运行期引入 Cinemachine(com.unity.cinemachine)(ADR-020 §二)。相机 = 自建机位(ICameraRig);**AC-20-02** 断言 manifest.json 无该条目"
    why: "零第三方取向已连续七处(ADR-014 解析器 / 015 几何工具 / 016 行为树 · 寻路 · 017 DOTS / 018 音频中间件 / 019 遥测 SDK / 020 相机);且 Cinemachine 3.0 是 post-cutoff 大重写(仓库 plugins/cinemachine.md:21 自陈『3.0 是 2.x 的大重写,许多 API 名已变』),知识风险由『不使用它』消解而非押注 API 名。『官方包』不是豁免 —— DOTS 同为官方包亦已被 ADR-017 结构性排除"
    adr: docs/architecture/adr-020-player-controller-and-camera.md
    added: 2026-09-15

  - pattern: camera_holding_game_state
    status: active
    description: "禁止相机持有游戏状态 / 写三流 / 引用 sim **实现**程序集(ADR-020 §五,AC-20-05;可引边界程序集白名单 —— ADR-005 Amendment F)。相机 = 只读渲染者;防抖 / 缓动吃表现态 dt,不入 sim。**VR 全禁镜头效果**(ADR-020 §六);禁用镜头效果**报**状态(与 audio_cue_state_broadcast 同源,是同一铁律的视觉侧)"
    why: "承 ADR-013 §9 C3(42 只渲染)/ ADR-018 §一(44 只触发)的同构体例 —— 呈现层三件套(UI / 音频 / 相机)同一纪律,避免第二套边界哲学;相机读 sim 真值或写流即制造第二真相"
    adr: docs/architecture/adr-020-player-controller-and-camera.md
    added: 2026-09-15
