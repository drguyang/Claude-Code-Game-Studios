# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: world_state_total_order
    status: active
    pattern: shared_resource  # 三流共享排序契约(ADR-009 §三 / Amendment E)
    producer: "主机"
    consumers:
      - "6 世界与生态区"
      - "17 采集"
      - "20 库存与物品"
      - "23 模块化建造"
      - "24 医馆即机器"
      - "45 网络层"
    adr: docs/architecture/adr-009-world-state-event-boundary.md
    signal_signature: "sort(a, b) = (Tick asc) → (StreamPriority: 病史<病例<世界) → (Patient asc) → (Seq asc)。Seq 发放域唯一 (Tick, Patient),三流共享;世界事件 Patient = PatientId.None"
    referenced_by:
      - docs/architecture/adr-009-world-state-event-boundary.md
      - docs/architecture/adr-006-fixed-point-boundary-contract.md   # Amendment E
    added: 2026-09-15
    revised: ""

